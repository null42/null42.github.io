<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" style="width:100%;max-width:1200px">
<title id="title">控制理论第一章概念地图</title><desc id="desc">从控制任务、物理对象、反馈结构、LTI表示、极点设计到数字实现的双向推理链</desc>
<defs><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f83d1"/><stop offset="1" stop-color="#275dad"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42a979"/><stop offset="1" stop-color="#287a58"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a69c7"/><stop offset="1" stop-color="#62439d"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6974f"/><stop offset="1" stop-color="#c66b28"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#db6c6c"/><stop offset="1" stop-color="#b84444"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a2d4a" flood-opacity=".18"/></filter><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#40536c"/></marker><marker id="arrowLight" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#73849a"/></marker></defs>
<rect width="1200" height="760" rx="24" fill="#f4f7fb"/><text x="600" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">从物理目标到可实现闭环：六层双向设计链</text><text x="600" y="73" text-anchor="middle" font-size="14" fill="#64748b">正向用于设计，反向用于解释、验算与故障定位</text>
<g filter="url(#shadow)"><rect x="55" y="120" width="300" height="130" rx="18" fill="url(#blue)"/><text x="205" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="white">1 任务与指标</text><text x="205" y="185" text-anchor="middle" font-size="14" fill="#edf6ff">参考 r · 输出 y · 输入 u</text><text x="205" y="210" text-anchor="middle" font-size="14" fill="#edf6ff">扰动 d · 噪声 n · 约束</text><text x="205" y="234" text-anchor="middle" font-size="13" fill="#d6e9ff">快 / 准 / 稳 / 控制量有限</text></g>
<g filter="url(#shadow)"><rect x="450" y="120" width="300" height="130" rx="18" fill="url(#green)"/><text x="600" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="white">2 物理对象与执行器</text><text x="600" y="185" text-anchor="middle" font-size="14" fill="#edfff5">力、力矩、惯量、阻尼</text><text x="600" y="210" text-anchor="middle" font-size="14" fill="#edfff5">四旋翼：v = B q</text><text x="600" y="234" text-anchor="middle" font-size="13" fill="#d8f6e6">工作点 · 线性化 · 可达集合</text></g>
<g filter="url(#shadow)"><rect x="845" y="120" width="300" height="130" rx="18" fill="url(#purple)"/><text x="995" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="white">3 反馈结构与节点</text><text x="995" y="185" text-anchor="middle" font-size="14" fill="#f6f0ff">e=r−y · u=Ke · y=Gu</text><text x="995" y="210" text-anchor="middle" font-size="14" fill="#f6f0ff">L=KG · S · T · KS · GS</text><text x="995" y="234" text-anchor="middle" font-size="13" fill="#e7dcff">前馈 / 反馈 / 内部回路</text></g>
<path d="M355 185 H438" fill="none" stroke="#40536c" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 185 H833" fill="none" stroke="#40536c" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="845" y="355" width="300" height="150" rx="18" fill="url(#orange)"/><text x="995" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="white">4 LTI 表示体系</text><text x="995" y="422" text-anchor="middle" font-size="14" fill="#fff7ed">微分方程 ↔ 冲激响应</text><text x="995" y="448" text-anchor="middle" font-size="14" fill="#fff7ed">卷积 ↔ 拉普拉斯 ↔ 传递函数</text><text x="995" y="478" text-anchor="middle" font-size="13" fill="#ffe7cf">零初值 · 因果 · BIBO稳定</text></g>
<g filter="url(#shadow)"><rect x="450" y="355" width="300" height="150" rx="18" fill="url(#red)"/><text x="600" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="white">5 极点、模态与设计</text><text x="600" y="422" text-anchor="middle" font-size="14" fill="#fff1f1">p ↔ e^{pt} · 残值 · 重复极点</text><text x="600" y="448" text-anchor="middle" font-size="14" fill="#fff1f1">Kp=Jωn²</text><text x="600" y="475" text-anchor="middle" font-size="14" fill="#fff1f1">Kd=2ζωnJ−D</text></g>
<g filter="url(#shadow)"><rect x="55" y="355" width="300" height="150" rx="18" fill="url(#blue)"/><text x="205" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="white">6 实现与验证</text><text x="205" y="422" text-anchor="middle" font-size="14" fill="#edf6ff">控制量 · 饱和 · 噪声 · 鲁棒性</text><text x="205" y="448" text-anchor="middle" font-size="14" fill="#edf6ff">采样 · ZOH · 计算延迟</text><text x="205" y="478" text-anchor="middle" font-size="13" fill="#d6e9ff">SIL → PIL → HIL → 实机</text></g>
<path d="M995 250 V343" fill="none" stroke="#40536c" stroke-width="3" marker-end="url(#arrow)"/><path d="M845 430 H762" fill="none" stroke="#40536c" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 430 H367" fill="none" stroke="#40536c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M205 355 V292 H600 V263" fill="none" stroke="#73849a" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowLight)"/><text x="390" y="283" text-anchor="middle" font-size="13" fill="#596b82">实现失败返回物理与目标层修正</text>
<rect x="85" y="575" width="1030" height="120" rx="18" fill="white" stroke="#ccd7e5" stroke-width="2"/><text x="110" y="610" font-size="17" font-weight="700" fill="#172033">贯穿全链的五个检查</text><g font-size="14" fill="#40536c"><text x="110" y="642">① 符号与单位</text><text x="300" y="642">② 低频 / 高频极限</text><text x="530" y="642">③ 内部稳定与极零抵消</text><text x="790" y="642">④ 扰动、噪声与控制量通道</text><text x="110" y="674">⑤ 参数、延迟、饱和与未建模动态的最坏情况验证</text></g>
<text x="600" y="730" text-anchor="middle" font-size="14" fill="#64748b">设计不是从公式出发，而是让每层模型都能解释上一层目标，并能在下一层实现中被验证。</text></svg>
