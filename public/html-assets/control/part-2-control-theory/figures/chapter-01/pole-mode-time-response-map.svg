<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc"><title id="title">极点位置与时间响应</title><desc id="desc">左半平面衰减、虚轴不衰减、右半平面增长，虚部决定振荡频率。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#275dad"/></marker><style>.axis{stroke:#34435f;stroke-width:3}.l{stroke:#275dad;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#24835b;stroke-width:4;fill:none}.u{stroke:#c33;stroke-width:4;fill:none}.t{font:700 25px sans-serif;fill:#17233c}.s{font:20px sans-serif;fill:#34435f}.m{font:19px monospace;fill:#8a3c12}</style></defs><text class="t" x="55" y="50">p=a+jb → e^(pt)=e^(at)e^(jbt)</text><line class="axis" x1="90" y1="300" x2="560" y2="300"/><line class="axis" x1="325" y1="80" x2="325" y2="520"/><text class="s" x="535" y="330">Re</text><text class="s" x="340" y="100">Im</text><circle cx="205" cy="190" r="9" fill="#24835b"/><circle cx="205" cy="410" r="9" fill="#24835b"/><text class="s" x="115" y="170">-sigma±j omega_d</text><circle cx="325" cy="175" r="9" fill="#d48806"/><circle cx="445" cy="300" r="9" fill="#c33"/><text class="s" x="90" y="555">左半平面：衰减</text><text class="s" x="280" y="555">虚轴：不衰减</text><text class="s" x="455" y="555">右半平面：增长</text><path class="d" d="M650 180C720 105 780 360 1030 300"/><text class="s" x="650" y="120">衰减振荡：e^(-sigma t)cos(omega_d t)</text><path class="u" d="M650 470C730 440 770 410 820 350C900 255 1000 145 1110 90"/><text class="s" x="650" y="520">正实部：包络随时间增长</text><path class="l" d="M565 300H625"/><text class="m" x="650" y="610">最靠近虚轴且残值显著的稳定极点通常主导长尾。</text></svg>
