<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">四旋翼控制因果链</title><desc id="desc">从参考误差、PD控制、虚拟力矩、控制分配、旋翼平方转速到刚体动力学与传感反馈。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2457a6"/></marker><style>.box{fill:#f5f8ff;stroke:#2457a6;stroke-width:3}.accent{fill:#fff5df;stroke:#d48806;stroke-width:3}.line{stroke:#2457a6;stroke-width:4;fill:none;marker-end:url(#arrow)}.feedback{stroke:#24835b;stroke-width:4;fill:none;marker-end:url(#arrow)}.t{font:700 26px sans-serif;fill:#17233c}.s{font:21px sans-serif;fill:#34435f}.f{font:20px monospace;fill:#8c3f13}</style></defs>
  <rect class="box" x="55" y="70" width="190" height="105" rx="16"/><text class="t" x="90" y="112">参考与误差</text><text class="s" x="82" y="148">e=q_c-q</text>
  <rect class="accent" x="305" y="70" width="220" height="105" rx="16"/><text class="t" x="355" y="112">PD 控制律</text><text class="s" x="326" y="148">M=K_p e-K_d q_dot</text>
  <rect class="box" x="585" y="70" width="230" height="105" rx="16"/><text class="t" x="620" y="112">虚拟力 / 力矩</text><text class="s" x="612" y="148">[F,Mα,Mβ,Mγ]</text>
  <rect class="box" x="875" y="70" width="250" height="105" rx="16"/><text class="t" x="920" y="112">控制分配</text><text class="s" x="905" y="148">v=B_a^-1 u_v</text>
  <path class="line" d="M245 122 H305"/><path class="line" d="M525 122 H585"/><path class="line" d="M815 122 H875"/>
  <rect class="box" x="875" y="275" width="250" height="115" rx="16"/><text class="t" x="910" y="319">四个旋翼通道</text><text class="s" x="902" y="356">v_i=omega_i^2</text>
  <rect class="accent" x="565" y="275" width="250" height="115" rx="16"/><text class="t" x="610" y="319">力与反扭矩</text><text class="s" x="592" y="356">F_i=k_F v_i, M_i=k_M v_i</text>
  <rect class="box" x="270" y="275" width="235" height="115" rx="16"/><text class="t" x="315" y="319">刚体动力学</text><text class="s" x="296" y="356">I q_ddot=M</text>
  <path class="line" d="M1000 175 V275"/><path class="line" d="M875 333 H815"/><path class="line" d="M565 333 H505"/>
  <rect class="box" x="55" y="275" width="155" height="115" rx="16"/><text class="t" x="91" y="319">姿态输出</text><text class="s" x="87" y="356">q, q_dot</text><path class="line" d="M270 333 H210"/>
  <path class="feedback" d="M132 390 V560 H150 V175"/><text class="s" x="160" y="535">传感器反馈</text>
  <rect class="accent" x="270" y="500" width="855" height="150" rx="16"/><text class="t" x="315" y="545">闭环设计检查</text><text class="s" x="315" y="588">I q_ddot+K_d q_dot+K_p q=K_p q_c</text><text class="f" x="315" y="625">omega_n=sqrt(K_p/I), zeta=K_d/(2sqrt(I K_p))</text><text class="s" x="785" y="588">坐标、饱和、噪声、延迟、采样</text>
</svg>
