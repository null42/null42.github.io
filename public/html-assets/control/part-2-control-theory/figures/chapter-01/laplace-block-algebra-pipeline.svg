<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">从物理方程到闭环响应</title><desc id="desc">微分方程、拉普拉斯变换、局部传递函数、节点消元、输入相乘与反变换的流程。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#275dad"/></marker><style>.b{fill:#f4f7ff;stroke:#275dad;stroke-width:3}.c{fill:#fff3dc;stroke:#cf7b00;stroke-width:3}.l{stroke:#275dad;stroke-width:4;fill:none;marker-end:url(#a)}.t{font:700 24px sans-serif;fill:#17233c}.s{font:19px sans-serif;fill:#34435f}.m{font:18px monospace;fill:#8a3c12}</style></defs><text class="t" x="55" y="52">传递函数是连接物理、结构和响应的中间语言</text><rect class="b" x="45" y="110" width="190" height="115" rx="14"/><text class="t" x="75" y="150">物理方程</text><text class="m" x="63" y="190">M q_ddot+Dq_dot+Kq=u</text><rect class="c" x="285" y="110" width="190" height="115" rx="14"/><text class="t" x="315" y="150">零初值变换</text><text class="m" x="315" y="190">s^n X(s)</text><rect class="b" x="525" y="110" width="190" height="115" rx="14"/><text class="t" x="555" y="150">局部通道</text><text class="m" x="560" y="190">G_i=Y_i/U_i</text><rect class="c" x="765" y="110" width="190" height="115" rx="14"/><text class="t" x="800" y="150">节点消元</text><text class="m" x="795" y="190">Y/R=N/D</text><rect class="b" x="1005" y="110" width="155" height="115" rx="14"/><text class="t" x="1028" y="150">具体输入</text><text class="m" x="1025" y="190">Y=G U</text><path class="l" d="M235 168H285"/><path class="l" d="M475 168H525"/><path class="l" d="M715 168H765"/><path class="l" d="M955 168H1005"/><rect class="c" x="285" y="340" width="630" height="125" rx="16"/><text class="t" x="340" y="385">反变换与模态解释</text><text class="m" x="340" y="425">Y(s) --partial fractions--> y(t)=Σ c_i e^(p_i t)+forced response</text><path class="l" d="M1080 225V285H600V340"/><rect class="b" x="285" y="525" width="630" height="100" rx="16"/><text class="t" x="340" y="565">六项交叉检查</text><text class="s" x="340" y="600">输入输出节点 · 初值 · 单位 · 极限 · 内部稳定 · 仿真/实验一致性</text><path class="l" d="M600 465V525"/></svg>
