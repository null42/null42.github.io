<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">LTI卷积证明</title><desc id="desc">任意输入分解成移位冲激，利用时不变、线性和因果性得到卷积。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#275dad"/></marker><style>.b{fill:#f5f8ff;stroke:#275dad;stroke-width:3}.c{fill:#fff4dc;stroke:#ce7b00;stroke-width:3}.l{stroke:#275dad;stroke-width:4;fill:none;marker-end:url(#a)}.t{font:700 25px sans-serif;fill:#17233c}.s{font:20px sans-serif;fill:#34435f}.m{font:19px monospace;fill:#8a3c12}</style></defs><text class="t" x="55" y="55">任意输入 → 移位冲激族 → 移位响应族 → 加权叠加</text><rect class="b" x="55" y="115" width="230" height="120" rx="14"/><text class="t" x="105" y="160">输入分解</text><text class="m" x="75" y="205">u(t)=∫u(τ)δ(t-τ)dτ</text><rect class="c" x="350" y="115" width="220" height="120" rx="14"/><text class="t" x="405" y="160">时不变</text><text class="m" x="373" y="205">δ(t-τ) → g(t-τ)</text><rect class="b" x="635" y="115" width="220" height="120" rx="14"/><text class="t" x="700" y="160">线性</text><text class="m" x="663" y="205">权重 u(τ) 可叠加</text><rect class="c" x="920" y="115" width="225" height="120" rx="14"/><text class="t" x="985" y="160">因果</text><text class="m" x="945" y="205">只保留 τ≤t</text><path class="l" d="M285 175H350"/><path class="l" d="M570 175H635"/><path class="l" d="M855 175H920"/><rect class="b" x="190" y="340" width="820" height="135" rx="18"/><text class="t" x="245" y="390">y(t)=∫_0^t u(τ) g(t-τ) dτ</text><text class="s" x="245" y="435">每个过去输入样本激发一份延迟冲激响应，当前输出是全部历史贡献之和。</text><path class="l" d="M1032 235V305H600V340"/><rect class="c" x="190" y="535" width="820" height="105" rx="18"/><text class="t" x="245" y="580">模型边界检查</text><text class="s" x="245" y="615">非线性：不能叠加；时变：核为 h(t,τ)；非因果：未来输入也参与；非零初值：另加自然响应。</text></svg>
