<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc"><title id="title">规范负反馈的多通道关系</title><desc id="desc">参考、输入扰动和测量噪声经控制器与对象形成闭环。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#275dad"/></marker><style>.b{fill:#f4f7ff;stroke:#275dad;stroke-width:3}.s{fill:#fff;stroke:#66758f;stroke-width:3}.l{stroke:#275dad;stroke-width:4;fill:none;marker-end:url(#a)}.f{stroke:#25835b;stroke-width:4;fill:none;marker-end:url(#a)}.t{font:700 26px sans-serif;fill:#17233c}.x{font:21px sans-serif;fill:#34435f}.m{font:21px monospace;fill:#8c3f13}</style></defs><text class="t" x="55" y="55">参考、扰动、噪声不是同一条传递通道</text><circle class="s" cx="205" cy="190" r="38"/><text class="t" x="188" y="199">Σ</text><text class="x" x="170" y="250">e=r-y-n</text><rect class="b" x="310" y="145" width="170" height="90" rx="14"/><text class="t" x="370" y="198">K(s)</text><circle class="s" cx="590" cy="190" r="38"/><text class="t" x="573" y="199">Σ</text><rect class="b" x="700" y="145" width="170" height="90" rx="14"/><text class="t" x="760" y="198">G(s)</text><path class="l" d="M50 190H167"/><text class="x" x="70" y="170">r</text><path class="l" d="M243 190H310"/><path class="l" d="M480 190H552"/><text class="x" x="500" y="170">u</text><path class="l" d="M628 190H700"/><path class="l" d="M870 190H1050"/><text class="x" x="995" y="170">y</text><path class="l" d="M590 75V152"/><text class="x" x="610" y="100">输入扰动 w</text><path class="f" d="M1000 190V390H205V228"/><path class="l" d="M720 390V360"/><text class="x" x="735" y="385">测量噪声 n 在反馈支路相加</text><text class="m" x="80" y="500">L=KG,  S=1/(1+L),  T=L/(1+L),  S+T=1</text><text class="m" x="80" y="550">y = T r + G S w - T n</text><text class="x" x="80" y="600">先写节点方程，再消元；不要用图形位置猜传递函数。</text></svg>
