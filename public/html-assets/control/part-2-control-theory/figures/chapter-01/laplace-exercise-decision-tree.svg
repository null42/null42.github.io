<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">拉普拉斯与框图习题决策树</title><desc id="desc">从正变换、逆变换和框图三种题型选择分解方法与检查。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#275dad"/></marker><style>.b{fill:#f4f7ff;stroke:#275dad;stroke-width:3}.c{fill:#fff3dc;stroke:#cf7b00;stroke-width:3}.l{stroke:#275dad;stroke-width:4;fill:none;marker-end:url(#a)}.t{font:700 24px sans-serif;fill:#17233c}.s{font:19px sans-serif;fill:#34435f}</style></defs><rect class="c" x="430" y="45" width="340" height="85" rx="15"/><text class="t" x="500" y="95">先识别题型与假设</text><rect class="b" x="60" y="220" width="300" height="150" rx="15"/><text class="t" x="145" y="265">正变换</text><text class="s" x="85" y="305">展开 / 基本对 / 时移 / 指数移位</text><text class="s" x="85" y="340">检查：初值与大 s 渐近</text><rect class="b" x="450" y="220" width="300" height="150" rx="15"/><text class="t" x="535" y="265">逆变换</text><text class="s" x="475" y="305">长除 / 因式 / 重数 / 配方</text><text class="s" x="475" y="340">检查：回代与初终值</text><rect class="b" x="840" y="220" width="300" height="150" rx="15"/><text class="t" x="925" y="265">框图</text><text class="s" x="865" y="305">命名分支 / 写节点 / 分层消元</text><text class="s" x="865" y="340">检查：关支路与极限</text><path class="l" d="M510 130L260 220"/><path class="l" d="M600 130V220"/><path class="l" d="M690 130L940 220"/><rect class="c" x="250" y="500" width="700" height="145" rx="18"/><text class="t" x="330" y="550">所有题共同的五项验收</text><text class="s" x="330" y="595">输入输出节点 · 因果/初值 · 单位 · 极点/稳定 · 数值或仿真交叉验证</text><path class="l" d="M210 370V440H500V500"/><path class="l" d="M600 370V500"/><path class="l" d="M990 370V440H700V500"/></svg>
