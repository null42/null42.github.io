<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 9,3.5 0,7z" fill="#24527a"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14283d}.b{fill:#eef6ff;stroke:#24527a;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.o{fill:#fff3e1;stroke:#b86b16;stroke-width:2}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.l{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1000" height="280" fill="#fcfeff"/><rect class="b" x="25" y="60" width="180" height="85" rx="12"/><text class="t" x="115" y="95" text-anchor="middle">极点/内部模态</text><text class="s" x="115" y="122" text-anchor="middle">RHP、虚轴、抵消</text><path class="l" d="M205 102H275"/><rect class="b" x="280" y="60" width="190" height="85" rx="12"/><text class="t" x="375" y="95" text-anchor="middle">1+L(s)=0</text><text class="s" x="375" y="122" text-anchor="middle">闭环特征方程</text><path class="l" d="M470 102H540"/><rect class="g" x="545" y="60" width="190" height="85" rx="12"/><text class="t" x="640" y="95" text-anchor="middle">Nyquist L(jω)</text><text class="s" x="640" y="122" text-anchor="middle">方向、−1、包围数</text><path class="l" d="M735 102H805"/><rect class="g" x="810" y="60" width="160" height="85" rx="12"/><text class="t" x="890" y="95" text-anchor="middle">闭环根Z</text><text class="s" x="890" y="122" text-anchor="middle">稳定/失稳</text><path class="l" d="M890 145V215H500"/><rect class="o" x="280" y="220" width="440" height="45" rx="12"/><text class="t" x="500" y="248" text-anchor="middle">增益/相位裕度与下一章鲁棒设计</text></svg>
