<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 9,3.5 0,7z" fill="#24527a"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14283d}.b{fill:#eef6ff;stroke:#24527a;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.o{fill:#fff3e1;stroke:#b86b16;stroke-width:2}.t{font-size:18px;font-weight:bold}.s{font-size:14px}.l{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1120" height="360" fill="#fcfeff"/><rect class="b" x="25" y="65" width="205" height="100" rx="12"/><text class="t" x="128" y="102" text-anchor="middle">题干与框图</text><text class="s" x="128" y="130" text-anchor="middle">输入、输出、反馈、初值</text><path class="l" d="M230 115H300"/><rect class="b" x="305" y="65" width="220" height="100" rx="12"/><text class="t" x="415" y="102" text-anchor="middle">通道分解</text><text class="s" x="415" y="130" text-anchor="middle">Y/R、Y/W、U/R</text><path class="l" d="M525 115H595"/><rect class="g" x="600" y="65" width="220" height="100" rx="12"/><text class="t" x="710" y="102" text-anchor="middle">指标与参数</text><text class="s" x="710" y="130" text-anchor="middle">终值、极点、Kp/Ki/Kd</text><path class="l" d="M820 115H890"/><rect class="g" x="895" y="65" width="200" height="100" rx="12"/><text class="t" x="995" y="102" text-anchor="middle">离散实现</text><text class="s" x="995" y="130" text-anchor="middle">位置式 / 增量式</text><path class="l" d="M995 165V245"/><rect class="o" x="760" y="250" width="335" height="75" rx="12"/><text class="t" x="928" y="281" text-anchor="middle">采样、滤波、限幅、anti-windup</text><text class="s" x="928" y="304" text-anchor="middle">SIL → HIL → 实机与日志复盘</text><path class="l" d="M760 287H570V165"/><text class="s" x="660" y="274" text-anchor="middle">失败则回到模型/指标</text></svg>
