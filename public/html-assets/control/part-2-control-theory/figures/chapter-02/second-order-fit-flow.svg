<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">二阶阶跃推导与拟合流程</title><desc id="desc">由标准二阶模型经拉普拉斯展开得到时域式，以峰值和超调拟合阻尼比和自然频率，再反馈验证模型与控制约束。</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 10,4 0,8z" fill="#1f4e79"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#132238}.b{fill:#eef6ff;stroke:#1f4e79;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.o{fill:#fff5e8;stroke:#bd6a10;stroke-width:2}.t{font-size:20px;font-weight:700}.s{font-size:16px}.l{stroke:#1f4e79;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="430" fill="#fbfdff"/><rect class="b" x="35" y="60" width="230" height="115" rx="14"/><text class="t" x="150" y="98" text-anchor="middle">1. 标准模型</text><text class="s" x="150" y="128" text-anchor="middle">T(s)=ωₙ²/(s²+2ζωₙs+ωₙ²)</text><text class="s" x="150" y="153" text-anchor="middle">零初值、单位阶跃</text><path class="l" d="M265 117H340"/><rect class="b" x="345" y="60" width="230" height="115" rx="14"/><text class="t" x="460" y="98" text-anchor="middle">2. 反演响应</text><text class="s" x="460" y="128" text-anchor="middle">平方配方 + 部分分式</text><text class="s" x="460" y="153" text-anchor="middle">衰减正弦 / 相位形式</text><path class="l" d="M575 117H650"/><rect class="g" x="655" y="60" width="230" height="115" rx="14"/><text class="t" x="770" y="98" text-anchor="middle">3. 提取特征</text><text class="s" x="770" y="128" text-anchor="middle">Mₚ、Tₚ、峰间距、y∞</text><text class="s" x="770" y="153" text-anchor="middle">先剔除时延与饱和段</text><path class="l" d="M885 117H960"/><rect class="g" x="965" y="60" width="200" height="115" rx="14"/><text class="t" x="1065" y="98" text-anchor="middle">4. 反求参数</text><text class="s" x="1065" y="128" text-anchor="middle">Mₚ → ζ</text><text class="s" x="1065" y="153" text-anchor="middle">Tₚ → ωₙ</text><path class="l" d="M1065 175V255H910"/><rect class="o" x="630" y="250" width="280" height="125" rx="14"/><text class="t" x="770" y="290" text-anchor="middle">5. 回代与验证</text><text class="s" x="770" y="320" text-anchor="middle">T̂(s) 与实测曲线残差</text><text class="s" x="770" y="347" text-anchor="middle">控制量、噪声、采样、饱和</text><path class="l" d="M630 312H530"/><rect class="o" x="245" y="250" width="280" height="125" rx="14"/><text class="t" x="385" y="290" text-anchor="middle">6. 控制器设计</text><text class="s" x="385" y="320" text-anchor="middle">指标 → 目标极点 → Kp、Kd、Ki</text><text class="s" x="385" y="347" text-anchor="middle">不满足约束则返回修改指标</text><path class="l" d="M245 312H150V175"/><text class="s" x="150" y="224" text-anchor="middle">模型不够好？</text></svg>
