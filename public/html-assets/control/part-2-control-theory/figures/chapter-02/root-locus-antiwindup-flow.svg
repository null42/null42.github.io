<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 9,3.5 0,7z" fill="#24527a"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14283d}.b{fill:#eef6ff;stroke:#24527a;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.o{fill:#fff3e1;stroke:#b86b16;stroke-width:2}.t{font-size:19px;font-weight:bold}.s{font-size:15px}.l{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="360" fill="#fcfeff"/><rect class="b" x="25" y="65" width="210" height="100" rx="12"/><text class="t" x="130" y="102" text-anchor="middle">指标与目标极点</text><text class="s" x="130" y="130" text-anchor="middle">ζ, ωₙ, 主导区域</text><path class="l" d="M235 115H305"/><rect class="b" x="310" y="65" width="220" height="100" rx="12"/><text class="t" x="420" y="102" text-anchor="middle">根轨迹 / 极点配置</text><text class="s" x="420" y="130" text-anchor="middle">Kp、Kd与实闭环根</text><path class="l" d="M530 115H600"/><rect class="g" x="605" y="65" width="210" height="100" rx="12"/><text class="t" x="710" y="102" text-anchor="middle">线性响应核对</text><text class="s" x="710" y="130" text-anchor="middle">峰值、尾部、控制量</text><path class="l" d="M815 115H885"/><rect class="o" x="890" y="65" width="185" height="100" rx="12"/><text class="t" x="982" y="102" text-anchor="middle">u=sat(v)</text><text class="s" x="982" y="130" text-anchor="middle">物理输入约束</text><path class="l" d="M982 165V245"/><rect class="o" x="755" y="250" width="320" height="80" rx="12"/><text class="t" x="915" y="282" text-anchor="middle">anti-windup：I˙=Ki e+Kaw(u−v)</text><text class="s" x="915" y="306" text-anchor="middle">条件积分 / 反算 / 恢复测试</text><path class="l" d="M755 290H560V165"/><text class="s" x="650" y="272" text-anchor="middle">失败则降低指标或重构结构</text></svg>
