<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 9,3.5 0,7z" fill="#24527a"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14283d}.b{fill:#eef6ff;stroke:#24527a;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.o{fill:#fff3e1;stroke:#b86b16;stroke-width:2}.t{font-size:18px;font-weight:bold}.s{font-size:14px}.l{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1120" height="360" fill="#fcfeff"/><rect class="b" x="25" y="65" width="205" height="100" rx="12"/><text class="t" x="128" y="102" text-anchor="middle">测得参考/扰动</text><text class="s" x="128" y="130" text-anchor="middle">输入通道与单位</text><path class="l" d="M230 115H300"/><rect class="b" x="305" y="65" width="220" height="100" rx="12"/><text class="t" x="415" y="102" text-anchor="middle">反馈 + 前馈</text><text class="s" x="415" y="130" text-anchor="middle">稳定/因果/限带逆</text><path class="l" d="M525 115H595"/><rect class="g" x="600" y="65" width="220" height="100" rx="12"/><text class="t" x="710" y="102" text-anchor="middle">内环 + 外环</text><text class="s" x="710" y="130" text-anchor="middle">带宽分离、等效对象</text><path class="l" d="M820 115H890"/><rect class="g" x="895" y="65" width="200" height="100" rx="12"/><text class="t" x="995" y="102" text-anchor="middle">离散接口</text><text class="s" x="995" y="130" text-anchor="middle">ADC→计算→PWM</text><path class="l" d="M995 165V245"/><rect class="o" x="760" y="250" width="335" height="75" rx="12"/><text class="t" x="928" y="281" text-anchor="middle">HIL / 实机验收</text><text class="s" x="928" y="304" text-anchor="middle">指标、故障、安全、日志重放</text><path class="l" d="M760 287H570V165"/><text class="s" x="660" y="274" text-anchor="middle">模型/带宽/接口不满足则回退</text></svg>
