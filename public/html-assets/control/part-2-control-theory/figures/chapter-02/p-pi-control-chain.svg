<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc" style="width:100%;max-width:1100px"><title id="title">P/PI控制知识链</title><desc id="desc">直流电机模型经过比例闭环、终值分析和积分器进入稳态误差消除与工程约束</desc><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#438bd4"/><stop offset="1" stop-color="#275dad"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#49ad7b"/><stop offset="1" stop-color="#287a58"/></linearGradient><linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e49a52"/><stop offset="1" stop-color="#bd6428"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d96d6d"/><stop offset="1" stop-color="#ae3d3d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".18"/></filter><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#465b74"/></marker></defs><rect width="1100" height="680" rx="22" fill="#f3f7fb"/><text x="550" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">P/PI：从对象模型到零稳态误差</text><text x="550" y="68" text-anchor="middle" font-size="14" fill="#63748a">每一步都要同时检查闭环极点、稳态误差和控制约束</text>
<g filter="url(#s)"><rect x="60" y="115" width="280" height="135" rx="18" fill="url(#g)"/><text x="200" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="white">直流电机对象</text><text x="200" y="181" text-anchor="middle" font-size="15" fill="white">Jω̇+α₀ω=β₀u−Mᵣ</text><text x="200" y="210" text-anchor="middle" font-size="14" fill="#e2fff0">u→i→转矩→ω</text><text x="200" y="232" text-anchor="middle" font-size="13" fill="#d4f5e3">参考与负载是两条输入</text></g><g filter="url(#s)"><rect x="410" y="115" width="280" height="135" rx="18" fill="url(#b)"/><text x="550" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="white">P 闭环</text><text x="550" y="181" text-anchor="middle" font-size="15" fill="white">ω̇+(α+βKp)ω=βKp r+d</text><text x="550" y="210" text-anchor="middle" font-size="14" fill="#edf6ff">极点左移 · 响应变快</text><text x="550" y="232" text-anchor="middle" font-size="13" fill="#d7eaff">但 eₛₛ=α/(α+βKp)</text></g><g filter="url(#s)"><rect x="760" y="115" width="280" height="135" rx="18" fill="url(#o)"/><text x="900" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="white">终值与稳态</text><text x="900" y="181" text-anchor="middle" font-size="15" fill="white">先检查稳定，再取 lim sX(s)</text><text x="900" y="210" text-anchor="middle" font-size="14" fill="#fff7ed">P：有限静差</text><text x="900" y="232" text-anchor="middle" font-size="13" fill="#ffe6ce">PI：稳定时零静差</text></g><path d="M340 182H398" stroke="#465b74" stroke-width="3" marker-end="url(#a)"/><path d="M690 182H748" stroke="#465b74" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="760" y="350" width="280" height="145" rx="18" fill="url(#r)"/><text x="900" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="white">PI 动态代价</text><text x="900" y="417" text-anchor="middle" font-size="14" fill="white">ż=e，u=Kp e+Ki z</text><text x="900" y="445" text-anchor="middle" font-size="14" fill="#fff1f1">低频增强 · 阶次增加</text><text x="900" y="472" text-anchor="middle" font-size="13" fill="#ffe0e0">相位裕度、超调、饱和</text></g><g filter="url(#s)"><rect x="410" y="350" width="280" height="145" rx="18" fill="url(#b)"/><text x="550" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="white">工程调参</text><text x="550" y="417" text-anchor="middle" font-size="14" fill="white">先安全 P，再逐步加 I</text><text x="550" y="445" text-anchor="middle" font-size="14" fill="#edf6ff">看 y、u、扰动恢复</text><text x="550" y="472" text-anchor="middle" font-size="13" fill="#d7eaff">限幅、噪声、参数变化</text></g><g filter="url(#s)"><rect x="60" y="350" width="280" height="145" rx="18" fill="url(#g)"/><text x="200" y="385" text-anchor="middle" font-size="20" font-weight="700" fill="white">下一条知识链</text><text x="200" y="417" text-anchor="middle" font-size="14" fill="white">D：趋势与阻尼</text><text x="200" y="445" text-anchor="middle" font-size="14" fill="#e2fff0">微分滤波 · PID</text><text x="200" y="472" text-anchor="middle" font-size="13" fill="#d4f5e3">再进入二阶暂态指标</text></g><path d="M900 250V338" stroke="#465b74" stroke-width="3" marker-end="url(#a)"/><path d="M760 422H702" stroke="#465b74" stroke-width="3" marker-end="url(#a)"/><path d="M410 422H352" stroke="#465b74" stroke-width="3" marker-end="url(#a)"/>
<path d="M200 350V285H550V263" fill="none" stroke="#78899e" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="335" y="278" text-anchor="middle" font-size="13" fill="#64748b">模型误差与约束返回重设参数</text><rect x="110" y="565" width="880" height="67" rx="15" fill="white" stroke="#ccd7e5" stroke-width="2"/><text x="550" y="594" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">验算：极点稳定 · 终值存在 · 静差达标 · 控制不饱和 · 扰动可恢复</text><text x="550" y="618" text-anchor="middle" font-size="13" fill="#63748a">PI 的零静差结论永远带有“闭环稳定且执行器可实现”的前提。</text></svg>
