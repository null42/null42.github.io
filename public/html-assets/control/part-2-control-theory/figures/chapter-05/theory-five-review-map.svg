<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">理论五稳定裕度与性能设计地图</title><desc id="desc">完整环路连接低频误差、交越裕度、延迟预算和实现验证。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#275dad"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14243a}.box{fill:#f8fbff;stroke:#275dad;stroke-width:2}.warn{fill:#fff8eb;stroke:#d46b3c;stroke-width:2}.line{stroke:#275dad;stroke-width:3;marker-end:url(#arrow)}.small{font-size:20px}.head{font-size:28px;font-weight:700}.eq{font-size:23px;font-family:Consolas,monospace}</style></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="45" text-anchor="middle" class="head">从规格到可验证的频域设计</text><rect x="440" y="85" width="320" height="105" rx="18" class="box"/><text x="600" y="125" text-anchor="middle" class="head">完整环路</text><text x="600" y="160" text-anchor="middle" class="eq">L=C·G·H·e⁻ˢᵀᵈ</text><rect x="55" y="270" width="300" height="155" rx="18" class="box"/><text x="205" y="310" text-anchor="middle" class="head">低频规格</text><text x="205" y="346" text-anchor="middle" class="small">S=1/(1+L)</text><text x="205" y="378" text-anchor="middle" class="small">系统类型、Kp/Kv/Ka</text><text x="205" y="408" text-anchor="middle" class="small">参考与扰动分别建模</text><rect x="450" y="270" width="300" height="155" rx="18" class="box"/><text x="600" y="310" text-anchor="middle" class="head">交越与裕度</text><text x="600" y="346" text-anchor="middle" class="small">ωc、PM、GM、P/N/Z</text><text x="600" y="378" text-anchor="middle" class="small">Td≈PM(rad)/ωc</text><text x="600" y="408" text-anchor="middle" class="small">多交越与传感器动态</text><rect x="845" y="270" width="300" height="155" rx="18" class="warn"/><text x="995" y="310" text-anchor="middle" class="head">高频与实现</text><text x="995" y="346" text-anchor="middle" class="small">T、CS、噪声与控制量</text><text x="995" y="378" text-anchor="middle" class="small">饱和、采样、量化、延迟</text><text x="995" y="408" text-anchor="middle" class="small">水床与未建模动态</text><line x1="520" y1="190" x2="260" y2="268" class="line"/><line x1="600" y1="190" x2="600" y2="268" class="line"/><line x1="680" y1="190" x2="940" y2="268" class="line"/><rect x="320" y="490" width="560" height="70" rx="18" class="warn"/><text x="600" y="532" text-anchor="middle" class="head">闭环验证：跟踪、各位置扰动、噪声、控制量、参数偏差、代码搜索边界</text><line x1="205" y1="426" x2="470" y2="490" class="line"/><line x1="600" y1="426" x2="600" y2="488" class="line"/><line x1="995" y1="426" x2="730" y2="490" class="line"/></svg>
