<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 320"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 9,3.5 0,7z" fill="#24527a"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14283d}.b{fill:#eef6ff;stroke:#24527a;stroke-width:2}.g{fill:#effaf3;stroke:#16804b;stroke-width:2}.t{font-size:18px;font-weight:bold}.s{font-size:14px}.l{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1050" height="320" fill="#fcfeff"/><rect class="b" x="25" y="60" width="190" height="90" rx="12"/><text class="t" x="120" y="96" text-anchor="middle">输入 e^(jωt)</text><text class="s" x="120" y="124" text-anchor="middle">单频复指数</text><path class="l" d="M215 105H285"/><rect class="b" x="290" y="60" width="205" height="90" rx="12"/><text class="t" x="392" y="96" text-anchor="middle">卷积与LTI</text><text class="s" x="392" y="124" text-anchor="middle">指数项提出积分</text><path class="l" d="M495 105H565"/><rect class="g" x="570" y="60" width="205" height="90" rx="12"/><text class="t" x="672" y="96" text-anchor="middle">G(jω)</text><text class="s" x="672" y="124" text-anchor="middle">模长 + 相位</text><path class="l" d="M775 105H845"/><rect class="g" x="850" y="60" width="175" height="90" rx="12"/><text class="t" x="937" y="96" text-anchor="middle">实正弦输出</text><text class="s" x="937" y="124" text-anchor="middle">A|G|cos(ωt+φ)</text><path class="l" d="M937 150V225H675"/><rect class="b" x="350" y="220" width="325" height="70" rx="12"/><text class="t" x="512" y="248" text-anchor="middle">扫频测量 → Bode 图 → 控制设计</text><text class="s" x="512" y="272" text-anchor="middle">稳态、线性、噪声、延迟、饱和检查</text><path class="l" d="M350 255H120V150"/></svg>
