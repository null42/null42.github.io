<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">离散卷积计算流程</title><desc id="desc">从h[k]翻转、移位，与x[k]相乘并求和得到y[n]</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#275dad"/></marker><style>.box{fill:#f7f9fc;stroke:#275dad;stroke-width:3;rx:18}.main{font:700 27px 'Microsoft YaHei',sans-serif;fill:#172033}.sub{font:21px 'Microsoft YaHei',sans-serif;fill:#46546a}.formula{font:24px Consolas,monospace;fill:#9b2c2c}.arrow{stroke:#275dad;stroke-width:4;marker-end:url(#arrow)}.note{fill:#fff5d9;stroke:#d19a00;stroke-width:2;rx:14}</style></defs><rect width="1200" height="620" fill="white"/><text x="600" y="55" text-anchor="middle" class="main">固定输出时刻 n，沿求和变量 k 完成卷积</text><rect class="box" x="45" y="120" width="220" height="150"/><text class="main" x="155" y="168" text-anchor="middle">1. 翻转</text><text class="formula" x="155" y="215" text-anchor="middle">h[k] → h[−k]</text><text class="sub" x="155" y="250" text-anchor="middle">关于 k=0 镜像</text><line class="arrow" x1="265" y1="195" x2="330" y2="195"/><rect class="box" x="340" y="120" width="220" height="150"/><text class="main" x="450" y="168" text-anchor="middle">2. 移位</text><text class="formula" x="450" y="215" text-anchor="middle">h[−k] → h[n−k]</text><text class="sub" x="450" y="250" text-anchor="middle">n 决定相对位置</text><line class="arrow" x1="560" y1="195" x2="625" y2="195"/><rect class="box" x="635" y="120" width="220" height="150"/><text class="main" x="745" y="168" text-anchor="middle">3. 相乘</text><text class="formula" x="745" y="215" text-anchor="middle">x[k]h[n−k]</text><text class="sub" x="745" y="250" text-anchor="middle">只保留支集交集</text><line class="arrow" x1="855" y1="195" x2="920" y2="195"/><rect class="box" x="930" y="120" width="220" height="150"/><text class="main" x="1040" y="168" text-anchor="middle">4. 求和</text><text class="formula" x="1040" y="215" text-anchor="middle">Σₖ x[k]h[n−k]</text><text class="sub" x="1040" y="250" text-anchor="middle">得到一个 y[n]</text><rect class="note" x="120" y="345" width="960" height="190"/><text class="main" x="600" y="392" text-anchor="middle">支集交集法：先把非零条件写成关于 k 的不等式</text><text class="formula" x="600" y="445" text-anchor="middle">x[k]≠0 的范围 ∩ h[n−k]≠0 的范围</text><text class="sub" x="600" y="492" text-anchor="middle">交集为空 ⇒ y[n]=0；边界随 n 切换 ⇒ 对 n 分段</text><text class="sub" x="600" y="525" text-anchor="middle">图解负责理解，交集不等式负责稳定地确定求和上下限</text></svg>
