<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">方程、框图与状态的对应关系</title><desc id="desc">上半部分是一阶离散递推系统，下半部分是一阶连续积分器系统，并标出延迟器或积分器保存状态。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#24445f"/></marker><style>.box{fill:#eef5ff;stroke:#275dad;stroke-width:3}.sum{fill:#fff7e8;stroke:#b26700;stroke-width:3}.state{fill:#edf9f1;stroke:#27864b;stroke-width:3}.line{fill:none;stroke:#24445f;stroke-width:3;marker-end:url(#arrow)}.txt{font-family:'Microsoft YaHei',sans-serif;fill:#183247;font-size:26px}.small{font-size:21px}.title{font-size:34px;font-weight:700;fill:#153d68}.eq{font-family:Cambria Math,'Times New Roman',serif;font-size:27px;fill:#102a43}</style></defs>
<rect width="1200" height="720" fill="#fbfdff"/><text x="60" y="60" class="title">差分/微分方程 → 可计算框图 → 状态存储</text>
<text x="60" y="115" class="eq">离散：y[n] = b x[n] − a y[n−1]</text><text x="60" y="150" class="small txt">单位延迟保存上一拍输出，状态 q[n]=y[n−1]</text>
<text x="75" y="245" class="txt">x[n]</text><path d="M145 238 H260" class="line"/><rect x="260" y="195" width="110" height="85" rx="10" class="box"/><text x="298" y="248" class="eq">b</text><path d="M370 238 H485" class="line"/><circle cx="530" cy="238" r="38" class="sum"/><text x="519" y="248" class="txt">Σ</text><path d="M568 238 H760" class="line"/><text x="780" y="247" class="txt">y[n]</text><path d="M690 238 V335 H640" class="line"/><rect x="500" y="295" width="140" height="80" rx="10" class="state"/><text x="548" y="345" class="eq">D</text><path d="M500 335 H390" class="line"/><rect x="280" y="295" width="110" height="80" rx="10" class="box"/><text x="310" y="345" class="eq">−a</text><path d="M280 335 H230 V270 H492" class="line"/><text x="680" y="370" class="small txt">延迟器 = 数字状态</text>
<line x1="60" y1="415" x2="1140" y2="415" stroke="#cbd8e6" stroke-width="2"/>
<text x="60" y="470" class="eq">连续：ẏ(t) = b x(t) − a y(t)</text><text x="60" y="505" class="small txt">积分器累计导数，状态就是积分器输出 y(t)</text>
<text x="75" y="600" class="txt">x(t)</text><path d="M140 592 H260" class="line"/><rect x="260" y="550" width="110" height="85" rx="10" class="box"/><text x="298" y="603" class="eq">b</text><path d="M370 592 H485" class="line"/><circle cx="530" cy="592" r="38" class="sum"/><text x="519" y="602" class="txt">Σ</text><path d="M568 592 H650" class="line"/><rect x="650" y="550" width="125" height="85" rx="10" class="state"/><text x="697" y="606" class="eq">∫</text><path d="M775 592 H950" class="line"/><text x="970" y="601" class="txt">y(t)</text><path d="M885 592 V680 H390" class="line"/><rect x="280" y="640" width="110" height="65" rx="10" class="box"/><text x="310" y="683" class="eq">−a</text><path d="M280 672 H220 V625 H492" class="line"/><text x="795" y="650" class="small txt">积分器 = 连续状态</text>
</svg>

