<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">连续卷积支集交集</title><desc id="d">翻转移位h并与x求支集交集后积分</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#275dad"/></marker><style>.b{fill:#f7f9fc;stroke:#275dad;stroke-width:3;rx:18}.h{font:700 27px 'Microsoft YaHei',sans-serif;fill:#172033}.p{font:22px 'Microsoft YaHei',sans-serif;fill:#46546a}.f{font:24px Consolas,monospace;fill:#9b2c2c}.l{stroke:#275dad;stroke-width:4;marker-end:url(#a)}.n{fill:#fff4d6;stroke:#d19a00;stroke-width:2;rx:14}</style></defs><rect width="1200" height="600" fill="white"/><text class="h" x="600" y="52" text-anchor="middle">连续卷积：固定 t，沿 τ 轴寻找重叠并积分</text><rect class="b" x="55" y="115" width="240" height="155"/><text class="h" x="175" y="165" text-anchor="middle">1. 写成 τ</text><text class="f" x="175" y="213" text-anchor="middle">x(τ), h(t−τ)</text><text class="p" x="175" y="248" text-anchor="middle">t 固定，τ 遍历</text><line class="l" x1="295" y1="193" x2="355" y2="193"/><rect class="b" x="365" y="115" width="240" height="155"/><text class="h" x="485" y="165" text-anchor="middle">2. 支集条件</text><text class="f" x="485" y="213" text-anchor="middle">τ∈Sx ∩ (t−Sh)</text><text class="p" x="485" y="248" text-anchor="middle">化为关于 τ 的不等式</text><line class="l" x1="605" y1="193" x2="665" y2="193"/><rect class="b" x="675" y="115" width="240" height="155"/><text class="h" x="795" y="165" text-anchor="middle">3. 分段</text><text class="f" x="795" y="213" text-anchor="middle">交集随 t 改变</text><text class="p" x="795" y="248" text-anchor="middle">找边界切换时刻</text><line class="l" x1="915" y1="193" x2="975" y2="193"/><rect class="b" x="985" y="115" width="170" height="155"/><text class="h" x="1070" y="165" text-anchor="middle">4. 积分</text><text class="f" x="1070" y="213" text-anchor="middle">∫x(τ)h(t−τ)dτ</text><text class="p" x="1070" y="248" text-anchor="middle">得到 y(t)</text><rect class="n" x="135" y="355" width="930" height="155"/><text class="h" x="600" y="402" text-anchor="middle">课件例2.6：x=e^(−at)u(t)，h=u(t)</text><text class="f" x="600" y="452" text-anchor="middle">τ≥0 ∩ τ≤t ⇒ t&lt;0 无重叠；t≥0 时 0≤τ≤t</text><text class="p" x="600" y="490" text-anchor="middle">因此 y(t)=∫₀ᵗe^(−aτ)dτ=(1/a)(1−e^(−at))u(t)</text></svg>
