<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">奇异函数的微分与积分层级</title><desc id="desc">从冲激高阶导数经单位冲激到阶跃、斜坡和抛物线截断函数，向右积分、向左微分。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#264b68"/></marker><style>.bg{fill:#fbfdff}.node{fill:#eef5ff;stroke:#275dad;stroke-width:3}.center{fill:#fff3df;stroke:#b26700;stroke-width:4}.txt{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:23px}.math{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:28px}.title{font-size:34px;font-weight:700}.arrow{stroke:#264b68;stroke-width:3;fill:none;marker-end:url(#arr)}.hint{font-size:20px;fill:#45657d}</style></defs><rect width="1240" height="760" class="bg"/><text x="55" y="62" class="txt title">奇异函数层级：向左微分，向右积分</text><text x="55" y="102" class="txt hint">卷积级联使索引相加；积分方向必须同时管理初始条件</text>
<rect x="55" y="255" width="170" height="130" rx="16" class="node"/><text x="105" y="310" class="math">δ″(t)</text><text x="82" y="350" class="txt">二阶微分器</text><rect x="285" y="255" width="170" height="130" rx="16" class="node"/><text x="340" y="310" class="math">δ′(t)</text><text x="325" y="350" class="txt">冲激偶</text><rect x="515" y="240" width="170" height="160" rx="18" class="center"/><text x="575" y="305" class="math">δ(t)</text><text x="548" y="348" class="txt">恒等系统</text><text x="555" y="378" class="txt hint">卷积单位元</text><rect x="745" y="255" width="170" height="130" rx="16" class="node"/><text x="800" y="310" class="math">u(t)</text><text x="776" y="350" class="txt">单位阶跃</text><rect x="975" y="255" width="205" height="130" rx="16" class="node"/><text x="1015" y="310" class="math">t u(t)</text><text x="1018" y="350" class="txt">单位斜坡</text>
<path d="M285 230H225" class="arrow"/><text x="230" y="205" class="txt hint">D</text><path d="M515 230H455" class="arrow"/><text x="460" y="205" class="txt hint">D</text><path d="M745 430H685" class="arrow"/><text x="690" y="465" class="txt hint">D</text><path d="M975 430H915" class="arrow"/><text x="920" y="465" class="txt hint">D</text>
<path d="M225 430H285" class="arrow"/><text x="232" y="465" class="txt hint">∫</text><path d="M455 430H515" class="arrow"/><text x="462" y="465" class="txt hint">∫</text><path d="M685 230H745" class="arrow"/><text x="692" y="205" class="txt hint">∫</text><path d="M915 230H975" class="arrow"/><text x="922" y="205" class="txt hint">∫</text>
<text x="70" y="545" class="math">g₀=δ，gₖ=δ⁽ᵏ⁾ (k&gt;0)，g₋ₘ=tᵐ⁻¹u(t)/(m−1)! (m≥1)</text><text x="70" y="605" class="math">Dgₖ=gₖ₊₁　　　∫gₖ=gₖ₋₁　　　gₚ*g_q=gₚ₊q</text><text x="70" y="670" class="txt">工程含义：高阶微分放大高频噪声；多重积分增加状态、低频增益与饱和风险。</text></svg>

