<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">由冲激响应判断LTI系统性质</title><desc id="d">冲激响应的支集、绝对面积和卷积逆决定系统性质</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#275dad"/></marker><style>.b{fill:#f7f9fc;stroke:#275dad;stroke-width:3;rx:18}.h{font:700 25px 'Microsoft YaHei',sans-serif;fill:#172033}.p{font:20px 'Microsoft YaHei',sans-serif;fill:#46546a}.f{font:21px Consolas,monospace;fill:#9b2c2c}.l{stroke:#275dad;stroke-width:3;marker-end:url(#a)}.warn{fill:#fff0ee;stroke:#c23b2a;stroke-width:2;rx:14}</style></defs><rect width="1200" height="760" fill="white"/><text class="h" x="600" y="48" text-anchor="middle">一个 h，读出 LTI 系统的五类关键信息</text><rect class="b" x="45" y="95" width="330" height="140"/><text class="h" x="210" y="137" text-anchor="middle">无记忆</text><text class="f" x="210" y="185" text-anchor="middle">h=Kδ</text><text class="p" x="210" y="218" text-anchor="middle">支集只在零时刻</text><rect class="b" x="435" y="95" width="330" height="140"/><text class="h" x="600" y="137" text-anchor="middle">可逆</text><text class="f" x="600" y="185" text-anchor="middle">h*h_inv=δ</text><text class="p" x="600" y="218" text-anchor="middle">还需检查逆的因果稳定性</text><rect class="b" x="825" y="95" width="330" height="140"/><text class="h" x="990" y="137" text-anchor="middle">因果</text><text class="f" x="990" y="185" text-anchor="middle">h(t)=0, t&lt;0</text><text class="p" x="990" y="218" text-anchor="middle">冲激发生前无响应</text><rect class="b" x="150" y="300" width="400" height="160"/><text class="h" x="350" y="345" text-anchor="middle">BIBO 稳定</text><text class="f" x="350" y="395" text-anchor="middle">Σ|h[n]|&lt;∞ 或 ∫|h(t)|dt&lt;∞</text><text class="p" x="350" y="435" text-anchor="middle">约束总绝对权重，不是有符号面积</text><rect class="b" x="650" y="300" width="400" height="160"/><text class="h" x="850" y="345" text-anchor="middle">阶跃响应</text><text class="f" x="850" y="395" text-anchor="middle">s=u*h</text><text class="p" x="850" y="435" text-anchor="middle">离散差分 / 连续微分恢复 h</text><line class="l" x1="600" y1="475" x2="600" y2="535"/><rect class="warn" x="120" y="550" width="960" height="145"/><text class="h" x="600" y="592" text-anchor="middle">关键校正：理想微分器 h=δ′ 不是 BIBO 稳定</text><text class="f" x="600" y="635" text-anchor="middle">∫δ′=0 ≠ ∫|δ′|&lt;∞；sin(ωt) → ωcos(ωt)</text><text class="p" x="600" y="674" text-anchor="middle">实际 D 环节必须限制高频增益并处理测量噪声</text><text class="p" x="600" y="735" text-anchor="middle">所有结论默认零状态 LTI；初始条件、非线性、时变与实现约束需另行检查</text></svg>
