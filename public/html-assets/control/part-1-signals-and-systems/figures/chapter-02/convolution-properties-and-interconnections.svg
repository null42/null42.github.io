<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">卷积性质与系统互联</title><desc id="d">交换分配结合律分别对应计算换序、并联和级联</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#275dad"/></marker><style>.b{fill:#f7f9fc;stroke:#275dad;stroke-width:3;rx:18}.h{font:700 27px 'Microsoft YaHei',sans-serif;fill:#172033}.p{font:21px 'Microsoft YaHei',sans-serif;fill:#46546a}.f{font:23px Consolas,monospace;fill:#9b2c2c}.l{stroke:#275dad;stroke-width:4;marker-end:url(#a)}.n{fill:#fff4d6;stroke:#d19a00;stroke-width:2;rx:14}</style></defs><rect width="1200" height="680" fill="white"/><text class="h" x="600" y="50" text-anchor="middle">卷积代数把公式化简与系统结构统一起来</text><rect class="b" x="55" y="105" width="310" height="170"/><text class="h" x="210" y="150" text-anchor="middle">交换律</text><text class="f" x="210" y="202" text-anchor="middle">x*h=h*x</text><text class="p" x="210" y="242" text-anchor="middle">选择更容易翻转移位的一侧</text><rect class="b" x="445" y="105" width="310" height="170"/><text class="h" x="600" y="150" text-anchor="middle">分配律</text><text class="f" x="600" y="202" text-anchor="middle">x*(h₁+h₂)=x*h₁+x*h₂</text><text class="p" x="600" y="242" text-anchor="middle">并联响应相加 / 拆分输入</text><rect class="b" x="835" y="105" width="310" height="170"/><text class="h" x="990" y="150" text-anchor="middle">结合律</text><text class="f" x="990" y="202" text-anchor="middle">x*(h₁*h₂)=(x*h₁)*h₂</text><text class="p" x="990" y="242" text-anchor="middle">级联响应卷积 / 改变括号</text><line class="l" x1="210" y1="280" x2="210" y2="345"/><line class="l" x1="600" y1="280" x2="600" y2="345"/><line class="l" x1="990" y1="280" x2="990" y2="345"/><rect class="n" x="80" y="360" width="1040" height="225"/><text class="h" x="600" y="407" text-anchor="middle">常用特殊冲激响应</text><text class="f" x="600" y="458" text-anchor="middle">延迟：δ(t−t₀)　微分：δ′(t)　积分：u(t)</text><text class="f" x="600" y="505" text-anchor="middle">x*δ(t−t₀)=x(t−t₀)　x*δ′=x′　x*u=∫x</text><text class="p" x="600" y="552" text-anchor="middle">先用代数性质重排，再用单位元/移位/微积分恒等式消去卷积</text><text class="p" x="600" y="630" text-anchor="middle">成立边界：零状态 LTI、运算存在；非线性、饱和、MIMO 矩阵次序需单独检查</text></svg>
