<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">例 1.1 的特征点变换序列</title>
  <desc id="desc">原信号及左移、反转平移、压缩、压缩平移后的关键点映射。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7788"/></marker></defs>
  <rect width="1100" height="650" rx="24" fill="#fbfcfe"/>
  <text x="550" y="42" text-anchor="middle" font-size="27" fill="#172033">统一方法：令内部自变量 u=at+b，再解 at+b=uᵢ</text>
  <g transform="translate(60,80)">
    <text x="170" y="0" text-anchor="middle" font-size="22" fill="#172033">原信号 x(t)：uᵢ=0,1,2</text>
    <line x1="15" y1="145" x2="330" y2="145" stroke="#26364d" stroke-width="2"/><line x1="70" y1="175" x2="70" y2="20" stroke="#26364d" stroke-width="2"/>
    <path d="M70 65 H175 L280 145" fill="none" stroke="#275dad" stroke-width="5"/>
    <g font-size="16" fill="#26364d" text-anchor="middle"><text x="70" y="168">0</text><text x="175" y="168">1</text><text x="280" y="168">2</text></g>
  </g>
  <g transform="translate(410,80)">
    <text x="170" y="0" text-anchor="middle" font-size="22" fill="#172033">x(t+1)：tᵢ=uᵢ−1</text>
    <line x1="15" y1="145" x2="330" y2="145" stroke="#26364d" stroke-width="2"/><line x1="175" y1="175" x2="175" y2="20" stroke="#26364d" stroke-width="2"/>
    <path d="M70 65 H175 L280 145" fill="none" stroke="#d46b3c" stroke-width="5"/>
    <g font-size="16" fill="#26364d" text-anchor="middle"><text x="70" y="168">−1</text><text x="175" y="168">0</text><text x="280" y="168">1</text></g>
  </g>
  <g transform="translate(760,80)">
    <text x="170" y="0" text-anchor="middle" font-size="22" fill="#172033">x(1−t)：tᵢ=1−uᵢ</text>
    <line x1="15" y1="145" x2="330" y2="145" stroke="#26364d" stroke-width="2"/><line x1="175" y1="175" x2="175" y2="20" stroke="#26364d" stroke-width="2"/>
    <path d="M70 145 L175 65 H280" fill="none" stroke="#7c51b8" stroke-width="5"/>
    <g font-size="16" fill="#26364d" text-anchor="middle"><text x="70" y="168">−1</text><text x="175" y="168">0</text><text x="280" y="168">1</text></g>
  </g>
  <path d="M380 165H405M730 165H755" stroke="#6b7788" stroke-width="2" marker-end="url(#a)"/>
  <g transform="translate(225,365)">
    <text x="170" y="0" text-anchor="middle" font-size="22" fill="#172033">x(3t/2)：tᵢ=(2/3)uᵢ</text>
    <line x1="15" y1="145" x2="330" y2="145" stroke="#26364d" stroke-width="2"/><line x1="70" y1="175" x2="70" y2="20" stroke="#26364d" stroke-width="2"/>
    <path d="M70 65 H175 L280 145" fill="none" stroke="#2f8a61" stroke-width="5"/>
    <g font-size="16" fill="#26364d" text-anchor="middle"><text x="70" y="168">0</text><text x="175" y="168">2/3</text><text x="280" y="168">4/3</text></g>
  </g>
  <g transform="translate(635,365)">
    <text x="170" y="0" text-anchor="middle" font-size="22" fill="#172033">x(3t/2+1)：tᵢ=(2/3)(uᵢ−1)</text>
    <line x1="15" y1="145" x2="330" y2="145" stroke="#26364d" stroke-width="2"/><line x1="175" y1="175" x2="175" y2="20" stroke="#26364d" stroke-width="2"/>
    <path d="M70 65 H175 L280 145" fill="none" stroke="#c34d67" stroke-width="5"/>
    <g font-size="16" fill="#26364d" text-anchor="middle"><text x="70" y="168">−2/3</text><text x="175" y="168">0</text><text x="280" y="168">2/3</text></g>
  </g>
  <text x="550" y="608" text-anchor="middle" font-size="19" fill="#5e6b7c">幅值始终保持；a&lt;0 时特征点顺序反转；任何图都可用代回内部自变量交叉检查。</text>
</svg>
