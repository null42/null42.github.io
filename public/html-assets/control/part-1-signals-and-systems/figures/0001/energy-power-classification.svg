<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">信号能量与平均功率分类</title>
  <desc id="desc">展示有限能量、有限非零平均功率、两者皆非和零信号边界。</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34465f"/></marker></defs>
  <rect width="1000" height="500" rx="24" fill="#fbfcfe"/>
  <text x="500" y="45" text-anchor="middle" font-size="28" font-family="Microsoft YaHei, sans-serif" fill="#172033">先算 E，再算 P；不要凭“会不会衰减”直接分类</text>
  <rect x="55" y="105" width="255" height="155" rx="18" fill="#eaf2ff" stroke="#275dad" stroke-width="3"/>
  <text x="182" y="145" text-anchor="middle" font-size="24" fill="#173f78">能量信号</text>
  <text x="182" y="185" text-anchor="middle" font-size="22" fill="#172033">0 &lt; E &lt; ∞</text>
  <text x="182" y="220" text-anchor="middle" font-size="22" fill="#172033">P = 0</text>
  <text x="182" y="247" text-anchor="middle" font-size="16" fill="#5e6b7c">例：有限时宽脉冲</text>
  <rect x="372" y="105" width="255" height="155" rx="18" fill="#fff2df" stroke="#d46b3c" stroke-width="3"/>
  <text x="500" y="145" text-anchor="middle" font-size="24" fill="#8c3f1e">功率信号</text>
  <text x="500" y="185" text-anchor="middle" font-size="22" fill="#172033">0 &lt; P &lt; ∞</text>
  <text x="500" y="220" text-anchor="middle" font-size="22" fill="#172033">E = ∞</text>
  <text x="500" y="247" text-anchor="middle" font-size="16" fill="#5e6b7c">例：e^{jω₀n}，P=1</text>
  <rect x="690" y="105" width="255" height="155" rx="18" fill="#f3ebff" stroke="#7c51b8" stroke-width="3"/>
  <text x="818" y="145" text-anchor="middle" font-size="24" fill="#5e3294">两者皆非</text>
  <text x="818" y="185" text-anchor="middle" font-size="20" fill="#172033">E = ∞</text>
  <text x="818" y="220" text-anchor="middle" font-size="20" fill="#172033">P 不存在或为 ∞</text>
  <text x="818" y="247" text-anchor="middle" font-size="16" fill="#5e6b7c">必须承认分类不完备</text>
  <rect x="370" y="330" width="260" height="95" rx="48" fill="#eef8ef" stroke="#39874b" stroke-width="3"/>
  <text x="500" y="370" text-anchor="middle" font-size="23" fill="#245c31">零信号：E=0，P=0</text>
  <text x="500" y="401" text-anchor="middle" font-size="16" fill="#5e6b7c">边界，不属于“非零有限”两类</text>
  <path d="M182 280 C230 325 315 345 365 365" fill="none" stroke="#34465f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M500 280V325" fill="none" stroke="#34465f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M818 280 C770 325 685 345 635 365" fill="none" stroke="#34465f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="472" text-anchor="middle" font-size="18" fill="#5e6b7c">“P=0”不能反推“E有限”；例如某些缓慢增长或稀疏信号可能仍有无穷能量。</text>
</svg>
