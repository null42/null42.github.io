<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc"><title id="title">第七章采样复盘概念地图</title><desc id="desc">从带限唯一性、频谱复制、重建与保持到连续离散映射、数字微分、分数延迟和多速率控制。</desc><defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#065f46"/><stop offset="1" stop-color="#10b981"/></linearGradient><linearGradient id="g3" x1="0" x2="1"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#f97316"/></linearGradient><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs><rect width="1280" height="840" rx="28" fill="#f8fafc"/><text x="640" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">采样：从信息唯一性到多速率数字控制</text><text x="640" y="78" text-anchor="middle" font-size="15" fill="#475569">一条推理链同时管理频谱、实现、时间轴与闭环裕度</text>
<rect x="55" y="112" width="1170" height="170" rx="20" fill="#eff6ff" stroke="#93c5fd"/><text x="80" y="145" font-size="20" font-weight="700" fill="#1e3a8a">信息层：样本为什么能代表信号？</text><rect x="90" y="178" width="190" height="70" rx="12" fill="url(#g1)"/><text x="185" y="207" text-anchor="middle" font-size="17" fill="white" font-weight="700">带限 |Ω|≤ΩM</text><text x="185" y="230" text-anchor="middle" font-size="13" fill="white">限制候选函数空间</text><rect x="355" y="178" width="220" height="70" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="465" y="207" text-anchor="middle" font-size="17" fill="#1e40af" font-weight="700">冲激串采样</text><text x="465" y="230" text-anchor="middle" font-size="13" fill="#334155">频谱间隔 Ωs，幅值 1/T</text><rect x="650" y="178" width="220" height="70" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="760" y="207" text-anchor="middle" font-size="17" fill="#1e40af" font-weight="700">Ωs &gt; 2ΩM</text><text x="760" y="230" text-anchor="middle" font-size="13" fill="#334155">副本分离，可唯一重建</text><rect x="945" y="178" width="220" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1055" y="207" text-anchor="middle" font-size="17" fill="#991b1b" font-weight="700">副本重叠 = 混叠</text><text x="1055" y="230" text-anchor="middle" font-size="13" fill="#7f1d1d">折叠、反转、不可逆</text><path d="M280 213H345M575 213H640M870 213H935" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<rect x="55" y="315" width="1170" height="190" rx="20" fill="#ecfdf5" stroke="#86efac"/><text x="80" y="348" font-size="20" font-weight="700" fill="#065f46">实现层：怎样从样本得到连续作用？</text><rect x="85" y="385" width="190" height="82" rx="12" fill="url(#g2)"/><text x="180" y="417" text-anchor="middle" font-size="17" fill="white" font-weight="700">C/D：ω=ΩT</text><text x="180" y="442" text-anchor="middle" font-size="13" fill="white">频谱2π周期延拓</text><rect x="330" y="385" width="190" height="82" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="425" y="417" text-anchor="middle" font-size="17" fill="#047857" font-weight="700">H_d(e^{jω})</text><text x="425" y="442" text-anchor="middle" font-size="13" fill="#334155">滤波、控制、估计</text><rect x="575" y="385" width="220" height="82" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="685" y="416" text-anchor="middle" font-size="17" fill="#047857" font-weight="700">数字微分 / 分数延迟</text><text x="685" y="442" text-anchor="middle" font-size="13" fill="#334155">边界拼接决定长尾</text><rect x="850" y="385" width="285" height="82" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="992" y="414" text-anchor="middle" font-size="17" fill="#047857" font-weight="700">D/C：ZOH、FOH、sinc</text><text x="992" y="438" text-anchor="middle" font-size="13" fill="#334155">下垂 + 群时延 + 因果代价</text><path d="M275 426H320M520 426H565M795 426H840" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="640" y="489" text-anchor="middle" font-size="14" fill="#065f46">真实等效响应还要串联前置滤波、计算/调度延迟、保持器与连续对象</text>
<rect x="55" y="540" width="1170" height="205" rx="20" fill="#fff7ed" stroke="#fdba74"/><text x="80" y="573" font-size="20" font-weight="700" fill="#9a3412">速率层：怎样安全改变数据率？</text><rect x="88" y="612" width="205" height="88" rx="12" fill="url(#g3)"/><text x="190" y="642" text-anchor="middle" font-size="17" fill="white" font-weight="700">抗混叠 Haa(z)</text><text x="190" y="667" text-anchor="middle" font-size="13" fill="white">限制到 π/N 以内</text><rect x="345" y="612" width="125" height="88" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="407" y="646" text-anchor="middle" font-size="25" fill="#9a3412" font-weight="700">↓ N</text><text x="407" y="673" text-anchor="middle" font-size="13" fill="#7c2d12">频谱分支相加</text><rect x="522" y="612" width="220" height="88" rx="12" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="632" y="642" text-anchor="middle" font-size="17" fill="#9a3412" font-weight="700">慢速估计 / 外环 / MPC</text><text x="632" y="668" text-anchor="middle" font-size="13" fill="#334155">周期 NT，统一时间戳</text><rect x="794" y="612" width="125" height="88" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="856" y="646" text-anchor="middle" font-size="25" fill="#9a3412" font-weight="700">↑ L</text><text x="856" y="673" text-anchor="middle" font-size="13" fill="#7c2d12">插零产生镜像</text><rect x="971" y="612" width="205" height="88" rx="12" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="1073" y="642" text-anchor="middle" font-size="17" fill="#9a3412" font-weight="700">抗成像 Hint(z)</text><text x="1073" y="668" text-anchor="middle" font-size="13" fill="#334155">增益 L，抑制镜像</text><path d="M293 656H335M470 656H512M742 656H784M919 656H961" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<rect x="115" y="775" width="1050" height="44" rx="12" fill="#e2e8f0"/><text x="640" y="803" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">最终验收：频谱无别名 · 增益正确 · 群时延对齐 · 连续开环裕度满足 · 实时与约束可实现</text></svg>
