<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">离散采样与多速率数字控制总图</title><desc id="desc">展示离散脉冲串采样、抽取前抗混叠、扩展后抗成像及多速率控制接口。</desc><defs><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#047857"/><stop offset="1" stop-color="#34d399"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs><rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">离散采样、抽取、扩展与多速率控制</text><text x="600" y="78" text-anchor="middle" font-size="15" fill="#475569">先在频域保护信息，再改变数据率；所有频率与延迟回到同一物理时间轴核对</text>
<rect x="55" y="125" width="1090" height="205" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="80" y="158" font-size="20" font-weight="700" fill="#1e3a8a">降采样路径 ↓N：混叠发生前必须处理</text><rect x="85" y="195" width="160" height="82" rx="12" fill="url(#blue)"/><text x="165" y="226" text-anchor="middle" font-size="17" fill="white" font-weight="700">高速序列 x[n]</text><text x="165" y="251" text-anchor="middle" font-size="14" fill="white">周期 T，带宽 ωp</text><rect x="315" y="195" width="185" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="407" y="225" text-anchor="middle" font-size="17" fill="#1e40af" font-weight="700">抗混叠低通</text><text x="407" y="251" text-anchor="middle" font-size="14" fill="#334155">阻带从 π/N 附近开始</text><rect x="570" y="195" width="120" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="630" y="228" text-anchor="middle" font-size="24" fill="#1e40af" font-weight="700">↓ N</text><text x="630" y="253" text-anchor="middle" font-size="13" fill="#334155">x_d[m]=x[mN]</text><rect x="760" y="195" width="215" height="82" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="867" y="225" text-anchor="middle" font-size="17" fill="#1e40af" font-weight="700">慢速估计 / 外环</text><text x="867" y="251" text-anchor="middle" font-size="14" fill="#334155">周期 NT，ω 轴扩展 N 倍</text><path d="M245 236H305M500 236H560M690 236H750" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="307" text-anchor="middle" font-size="14" fill="#b91c1c">若前置滤波不足：N 个频谱分支相加，混叠不可逆</text>
<rect x="55" y="365" width="1090" height="205" rx="18" fill="#ecfdf5" stroke="#86efac"/><text x="80" y="398" font-size="20" font-weight="700" fill="#065f46">升采样路径 ↑L：插零产生镜像，随后删除</text><rect x="85" y="435" width="200" height="82" rx="12" fill="url(#green)"/><text x="185" y="466" text-anchor="middle" font-size="17" fill="white" font-weight="700">慢速命令 / 参考</text><text x="185" y="491" text-anchor="middle" font-size="14" fill="white">周期 T，频谱 X(e^{jω})</text><rect x="350" y="435" width="120" height="82" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="410" y="468" text-anchor="middle" font-size="24" fill="#047857" font-weight="700">↑ L</text><text x="410" y="493" text-anchor="middle" font-size="13" fill="#334155">插入 L−1 个零</text><rect x="535" y="435" width="200" height="82" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="635" y="465" text-anchor="middle" font-size="17" fill="#047857" font-weight="700">抗成像内插滤波</text><text x="635" y="491" text-anchor="middle" font-size="14" fill="#334155">增益 L，截止约 π/L</text><rect x="800" y="435" width="205" height="82" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="902" y="465" text-anchor="middle" font-size="17" fill="#047857" font-weight="700">高速执行 / 内环</text><text x="902" y="491" text-anchor="middle" font-size="14" fill="#334155">周期 T/L，频谱压缩</text><path d="M285 476H340M470 476H525M735 476H790" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="548" text-anchor="middle" font-size="14" fill="#047857">X_e(e^{jω})=X(e^{jLω})：中心副本保留，2πk/L 附近镜像被抑制</text>
<rect x="105" y="620" width="990" height="64" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="600" y="647" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">统一验收：物理带宽 Ω、各段采样周期、通带增益、群延迟、调度延迟与保持器</text><text x="600" y="671" text-anchor="middle" font-size="14" fill="#7c2d12">↓N 前保护信息；↑L 后清除成像；用 Hz/rad·s⁻¹ 校核跨速率频率，用秒校核所有延迟</text></svg>
