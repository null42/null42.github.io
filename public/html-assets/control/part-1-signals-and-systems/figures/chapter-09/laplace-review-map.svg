<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L10,3L0,6Z" fill="#275dad"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#14243a}.b{fill:#f7fbff;stroke:#275dad;stroke-width:2}.w{fill:#fff8eb;stroke:#d46b3c;stroke-width:2}.t{font-size:24px;font-weight:bold}.s{font-size:18px}.l{stroke:#275dad;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1100" height="510" fill="white"/><text x="550" y="40" text-anchor="middle" class="t">拉普拉斯变换：表达式、ROC、初值和极点</text><rect x="370" y="70" width="360" height="85" rx="16" class="b"/><text x="550" y="108" text-anchor="middle" class="t">X(s)=L{x(t)}</text><text x="550" y="137" text-anchor="middle" class="s">复频率 s=σ+jω</text><rect x="35" y="230" width="230" height="125" rx="16" class="b"/><text x="150" y="270" text-anchor="middle" class="t">ROC</text><text x="150" y="305" text-anchor="middle" class="s">左右边信号、收敛</text><text x="150" y="332" text-anchor="middle" class="s">虚轴与频响</text><rect x="300" y="230" width="230" height="125" rx="16" class="b"/><text x="415" y="270" text-anchor="middle" class="t">性质</text><text x="415" y="305" text-anchor="middle" class="s">时移、微分、卷积</text><text x="415" y="332" text-anchor="middle" class="s">初值项</text><rect x="565" y="230" width="230" height="125" rx="16" class="b"/><text x="680" y="270" text-anchor="middle" class="t">系统函数</text><text x="680" y="305" text-anchor="middle" class="s">H(s)、极点、零点</text><text x="680" y="332" text-anchor="middle" class="s">因果与稳定</text><rect x="830" y="230" width="235" height="125" rx="16" class="w"/><text x="947" y="270" text-anchor="middle" class="t">单边变换</text><text x="947" y="305" text-anchor="middle" class="s">启动瞬态、初始条件</text><text x="947" y="332" text-anchor="middle" class="s">控制建模</text><line x1="470" y1="155" x2="150" y2="228" class="l"/><line x1="520" y1="155" x2="415" y2="228" class="l"/><line x1="580" y1="155" x2="680" y2="228" class="l"/><line x1="630" y1="155" x2="947" y2="228" class="l"/><rect x="210" y="425" width="680" height="55" rx="15" class="w"/><text x="550" y="460" text-anchor="middle" class="t">控制验收：内部稳定、终值前提、初值、饱和与模型一致性</text></svg>
