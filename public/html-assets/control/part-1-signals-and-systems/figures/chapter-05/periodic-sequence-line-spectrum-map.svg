<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc"><title id="title">周期序列DTFS系数到DTFT冲激线谱映射</title><desc id="desc">展示常数、离散复指数、N周期序列和余弦如何形成2π周期冲激线谱，以及其控制迁移。</desc><defs><style>.bg{fill:#f7fafc}.box{fill:#fff;stroke:#345b78;stroke-width:2}.core{fill:#e6f3ff;stroke:#1474ae;stroke-width:3}.warn{fill:#fff4df;stroke:#b36b00;stroke-width:2}.h{font:700 23px 'Microsoft YaHei',sans-serif;fill:#17324d}.t{font:17px 'Microsoft YaHei',sans-serif;fill:#243b53}.f{font:17px Consolas,'Microsoft YaHei',sans-serif;fill:#102a43}.a{stroke:#345b78;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#345b78"/></marker></defs><rect class="bg" width="1300" height="680" rx="24"/><text class="h" x="40" y="45">周期序列的DTFT：有限个独立谐波，展开成2π周期冲激线谱</text>
<rect class="box" x="40" y="85" width="280" height="155" rx="16"/><text class="h" x="65" y="122">常数序列</text><text class="f" x="65" y="164">x[n]=1</text><text class="f" x="65" y="202">X=2πΣδ(ω−2πk)</text><text class="t" x="65" y="230">一圈只有直流线</text>
<rect class="box" x="370" y="85" width="330" height="155" rx="16"/><text class="h" x="395" y="122">离散复指数</text><text class="f" x="395" y="164">x[n]=eʲω⁰ⁿ</text><text class="f" x="395" y="202">ω=ω₀+2πk，权重2π</text><text class="t" x="395" y="230">所有副本是同一单位圆模式</text>
<rect class="core" x="750" y="75" width="500" height="175" rx="18"/><text class="h" x="775" y="115">N周期序列</text><text class="f" x="775" y="153">x[n]=Σaₖeʲ²πᵏⁿ/ᴺ</text><text class="f" x="775" y="191">X=Σ2πaₖδ(ω−2πk/N)</text><text class="t" x="775" y="225">aₖ：DTFS坐标；2πaₖ：冲激面积</text><path class="a" d="M320 162 H360"/><path class="a" d="M700 162 H740"/>
<rect class="warn" x="40" y="330" width="350" height="220" rx="16"/><text class="h" x="65" y="368">索引与周期</text><text class="t" x="65" y="406">aₖ₊ᴺ=aₖ</text><text class="t" x="65" y="439">k+N → 频率增加2π</text><text class="t" x="65" y="472">k=N−1 ≡ −1</text><text class="t" x="65" y="505">π≡−π，重合权重相加</text><text class="t" x="65" y="538">一圈外副本不是新自由度</text>
<rect class="box" x="440" y="320" width="360" height="240" rx="16"/><text class="h" x="465" y="358">实余弦例题</text><text class="f" x="465" y="398">cosω₀n=(eʲω⁰ⁿ+e⁻ʲω⁰ⁿ)/2</text><text class="t" x="465" y="435">一圈：±ω₀两根谱线</text><text class="t" x="465" y="468">每根冲激面积π</text><text class="t" x="465" y="501">实序列：正负权重共轭</text><text class="t" x="465" y="534">ω₀=0或π时两线重合</text>
<rect class="core" x="850" y="320" width="400" height="240" rx="16"/><text class="h" x="875" y="358">控制迁移</text><text class="t" x="875" y="398">周期误差 → 有限个独立谐波</text><text class="t" x="875" y="431">谐振/重复控制逐线塑形</text><text class="t" x="875" y="464">连续频率别名 → 抗混叠</text><text class="t" x="875" y="497">正负旋转分量 → I/Q控制</text><text class="t" x="875" y="530">周期漂移 → 自适应或宽带鲁棒峰</text><path class="a" d="M1000 250 V290 H620 V310"/><path class="a" d="M800 440 H840"/>
<text class="t" x="40" y="625">统一验算：反变换恢复DTFS · 冲激面积含2π · 一圈内不重复 · 实序列共轭对称 · 周期功率用Σ|aₖ|²</text></svg>
