<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="650" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc"><title id="title">DTFS到DTFT及基本序列变换图</title><desc id="desc">展示有限序列周期延拓、周期趋于无穷、频率样本趋密、DTFT变换对、单位圆周期性和三个基本序列变换。</desc><defs><style>.bg{fill:#f7fafc}.box{fill:#fff;stroke:#345b78;stroke-width:2}.core{fill:#e6f3ff;stroke:#1474ae;stroke-width:3}.warn{fill:#fff4df;stroke:#b36b00;stroke-width:2}.h{font:700 23px 'Microsoft YaHei',sans-serif;fill:#17324d}.t{font:17px 'Microsoft YaHei',sans-serif;fill:#243b53}.f{font:17px Consolas,'Microsoft YaHei',sans-serif;fill:#102a43}.a{stroke:#345b78;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#345b78"/></marker></defs><rect class="bg" width="1260" height="650" rx="24"/><text class="h" x="40" y="45">离散时间傅里叶变换：有限维坐标的无限周期极限</text>
<rect class="box" x="40" y="85" width="270" height="155" rx="16"/><text class="h" x="65" y="122">有限序列x[n]</text><text class="t" x="65" y="160">有效支撑内非零</text><text class="t" x="65" y="193">周期延拓为x̃[n]</text><text class="t" x="65" y="222">选N避免副本重叠</text>
<rect class="box" x="355" y="85" width="275" height="155" rx="16"/><text class="h" x="380" y="122">N点DTFS</text><text class="f" x="380" y="160">ωₖ=2πk/N</text><text class="f" x="380" y="193">aₖ=X(eʲωᵏ)/N</text><text class="t" x="380" y="222">有限N个精确坐标</text>
<rect class="core" x="680" y="75" width="525" height="175" rx="18"/><text class="h" x="705" y="113">N→∞：DTFT连续频率函数</text><text class="f" x="705" y="153">X(eʲω)=Σx[n]e⁻ʲωⁿ</text><text class="f" x="705" y="190">x[n]=1/(2π)∫₂πX(eʲω)eʲωⁿdω</text><text class="t" x="705" y="225">频率连续 · 每2π重复 · 单位圆一圈</text><path class="a" d="M310 162 H345"/><path class="a" d="M630 162 H670"/>
<rect class="warn" x="40" y="330" width="350" height="205" rx="16"/><text class="h" x="65" y="368">为什么2π周期？</text><text class="f" x="65" y="407">eʲ⁽ω⁺²π⁾ⁿ=eʲωⁿ</text><text class="t" x="65" y="445">整数时间无法区分ω与ω+2π</text><text class="t" x="65" y="478">ω=ΩTₛ，按2π折叠</text><text class="t" x="65" y="511">单位圆z=eʲω只需绕一圈</text>
<rect class="box" x="440" y="315" width="350" height="235" rx="16"/><text class="h" x="465" y="353">基本序列变换</text><text class="t" x="465" y="392">右边指数：一阶有理频谱</text><text class="t" x="465" y="425">双边指数：实偶Poisson核</text><text class="t" x="465" y="458">矩形序列：周期正弦比</text><text class="t" x="465" y="491">时域越长，频域峰越窄</text><text class="t" x="465" y="524">0/0点用极限恢复序列总和</text>
<rect class="core" x="840" y="315" width="365" height="235" rx="16"/><text class="h" x="865" y="353">数字控制迁移</text><text class="t" x="865" y="392">极点半径：衰减与带宽</text><text class="t" x="865" y="425">极点角度：谱峰中心</text><text class="t" x="865" y="458">移动平均零点：谐波抑制</text><text class="t" x="865" y="491">窗口长度：分辨率与延迟</text><text class="t" x="865" y="524">ROC含单位圆：频响存在</text><path class="a" d="M942 250 V295 H615 V305"/><path class="a" d="M790 432 H830"/>
<text class="t" x="40" y="610">统一验算：2π周期 · X(1)=Σx[n] · 实序列共轭对称 · 单位圆/ROC · ω=0的0/0极限 · 物理频率换算</text></svg>
