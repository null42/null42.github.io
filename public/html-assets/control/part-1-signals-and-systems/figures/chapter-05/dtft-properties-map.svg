<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">DTFT性质、插零扩展、帕斯瓦尔与卷积映射图</title><desc id="desc">展示DTFT性质选择、对称结构、差分累加、插零扩展、频域微分、能量与LTI卷积的关系。</desc><defs><style>.bg{fill:#f7fafc}.box{fill:#fff;stroke:#345b78;stroke-width:2}.core{fill:#e6f3ff;stroke:#1474ae;stroke-width:3}.warn{fill:#fff4df;stroke:#b36b00;stroke-width:2}.h{font:700 22px 'Microsoft YaHei',sans-serif;fill:#17324d}.t{font:16px 'Microsoft YaHei',sans-serif;fill:#243b53}.f{font:16px Consolas,'Microsoft YaHei',sans-serif;fill:#102a43}.a{stroke:#345b78;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#345b78"/></marker></defs><rect class="bg" width="1320" height="760" rx="24"/><text class="h" x="40" y="45">DTFT性质工作流：识别时域结构 → 频域变换 → 边界检查 → 控制迁移</text>
<rect class="box" x="40" y="85" width="285" height="190" rx="16"/><text class="h" x="65" y="122">位置与频率</text><text class="f" x="65" y="160">时移 → e⁻ʲωⁿ⁰X</text><text class="f" x="65" y="195">调制 → X(ω−ω₀)</text><text class="t" x="65" y="230">延迟相位 · 同步坐标</text><text class="t" x="65" y="258">分数延迟需滤波器实现</text>
<rect class="box" x="365" y="85" width="285" height="190" rx="16"/><text class="h" x="390" y="122">共轭与对称</text><text class="t" x="390" y="160">实序列：X(−ω)=X*(ω)</text><text class="t" x="390" y="195">偶部 ↔ ReX</text><text class="t" x="390" y="230">奇部 ↔ jImX</text><text class="t" x="390" y="258">实系数极零点共轭成对</text>
<rect class="warn" x="690" y="75" width="300" height="210" rx="16"/><text class="h" x="715" y="112">差分与累加</text><text class="f" x="715" y="150">Δx ↔ (1−e⁻ʲω)X</text><text class="t" x="715" y="185">差分：压低直流、放大高频</text><text class="t" x="715" y="220">累加：除因子＋周期直流冲激</text><text class="t" x="715" y="255">积分饱和 · 泄漏积分器</text>
<rect class="core" x="1030" y="75" width="250" height="210" rx="16"/><text class="h" x="1055" y="112">频域微分</text><text class="f" x="1055" y="153">nx[n] ↔ j dX/dω</text><text class="t" x="1055" y="190">时间矩 · 延迟估计</text><text class="t" x="1055" y="225">群延迟 · 光滑度</text><text class="t" x="1055" y="258">需加权可和条件</text>
<rect class="core" x="70" y="370" width="360" height="230" rx="16"/><text class="h" x="95" y="408">插零时域扩展</text><text class="f" x="95" y="448">x₍ₖ₎[n] ↔ X(eʲᵏω)</text><text class="t" x="95" y="485">一圈出现k份压缩镜像</text><text class="t" x="95" y="520">能量不变，信息不增加</text><text class="t" x="95" y="555">插值低通抑制成像</text><text class="t" x="95" y="585">抽取另有副本相加与混叠</text>
<rect class="box" x="480" y="370" width="330" height="230" rx="16"/><text class="h" x="505" y="408">帕斯瓦尔</text><text class="f" x="505" y="448">Σ|x[n]|²=(1/2π)∫₂π|X|²</text><text class="t" x="505" y="485">只积分单位圆一圈</text><text class="t" x="505" y="520">有限能量序列口径</text><text class="t" x="505" y="555">周期序列改用DTFS功率</text><text class="t" x="505" y="585">H₂与加权误差指标</text>
<rect class="core" x="860" y="370" width="390" height="230" rx="16"/><text class="h" x="885" y="408">卷积与LTI系统</text><text class="f" x="885" y="448">x*h ↔ X(eʲω)H(eʲω)</text><text class="t" x="885" y="485">复指数是LTI特征函数</text><text class="t" x="885" y="520">串联系统频响相乘</text><text class="t" x="885" y="555">延迟、滤波、闭环灵敏度</text><text class="t" x="885" y="585">h绝对可和保证稳定频响</text>
<path class="a" d="M325 180 H355"/><path class="a" d="M650 180 H680"/><path class="a" d="M990 180 H1020"/><path class="a" d="M840 285 V330 H250 V360"/><path class="a" d="M430 485 H470"/><path class="a" d="M810 485 H850"/>
<text class="t" x="40" y="690">统一验算：2π周期 · 实序列共轭对称 · ω=0/π边界 · 累加直流冲激 · 插零镜像数 · 一圈能量 · h=δ退化检查</text></svg>
