<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">DTFT、LTI系统与差分方程知识链</title><desc id="desc">从冲激响应和差分方程两条路径得到系统函数，检查ROC与单位圆后形成频率响应，并连接延迟、极点和数字控制实现。</desc>
  <defs><style>.box{fill:#f7faff;stroke:#275dad;stroke-width:2;rx:14}.warn{fill:#fff5e8;stroke:#d87500;stroke-width:2;rx:14}.ctrl{fill:#eef9f1;stroke:#23824b;stroke-width:2;rx:14}.t{font:700 22px 'Microsoft YaHei',sans-serif;fill:#17335c}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#26384f}.a{stroke:#526b8d;stroke-width:2.5;fill:none;marker-end:url(#m)}.d{stroke-dasharray:8 6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#526b8d"/></marker></defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <rect class="box" x="50" y="60" width="250" height="120"/><text class="t" x="175" y="100" text-anchor="middle">冲激响应 h[n]</text><text class="s" x="175" y="135" text-anchor="middle">DTFT：Σh[n]e⁻ʲᵠⁿ</text><text class="s" x="175" y="162" text-anchor="middle">卷积：Y=HX</text>
  <rect class="box" x="50" y="280" width="250" height="140"/><text class="t" x="175" y="320" text-anchor="middle">常系数差分方程</text><text class="s" x="175" y="354" text-anchor="middle">A(z⁻¹)y=B(z⁻¹)x</text><text class="s" x="175" y="382" text-anchor="middle">H(z)=B/A</text>
  <rect class="box" x="405" y="155" width="290" height="160"/><text class="t" x="550" y="198" text-anchor="middle">系统函数 / 频率响应</text><text class="s" x="550" y="235" text-anchor="middle">H(eʲᵠ)=H(z)|z=eʲᵠ</text><text class="s" x="550" y="266" text-anchor="middle">幅值塑形 + 相位塑形</text><text class="s" x="550" y="294" text-anchor="middle">延迟：e⁻ʲᵠⁿ⁰</text>
  <rect class="warn" x="785" y="55" width="280" height="190"/><text class="t" x="925" y="95" text-anchor="middle">单位圆检查</text><text class="s" x="925" y="132" text-anchor="middle">ROC 是否包含 |z|=1？</text><text class="s" x="925" y="164" text-anchor="middle">因果：ROC在最外极点外</text><text class="s" x="925" y="196" text-anchor="middle">稳定：单位圆属于ROC</text><text class="s" x="925" y="226" text-anchor="middle">因果有理：极点严格在圆内</text>
  <rect class="box" x="405" y="410" width="290" height="135"/><text class="t" x="550" y="451" text-anchor="middle">性质工具</text><text class="s" x="550" y="485" text-anchor="middle">相乘 ↔ 周期卷积</text><text class="s" x="550" y="515" text-anchor="middle">DTFS 对偶 ↔ 结构识别</text>
  <rect class="ctrl" x="785" y="350" width="280" height="195"/><text class="t" x="925" y="392" text-anchor="middle">数字控制迁移</text><text class="s" x="925" y="428" text-anchor="middle">ω=ΩTₛ 与 Nyquist</text><text class="s" x="925" y="460" text-anchor="middle">延迟 → 相位裕度损失</text><text class="s" x="925" y="492" text-anchor="middle">极点 → 暂态与鲁棒性</text><text class="s" x="925" y="524" text-anchor="middle">系数 → 差分方程代码</text>
  <path class="a" d="M300 120 C350 120 360 195 405 210"/><path class="a" d="M300 350 C360 350 360 280 405 260"/><path class="a" d="M695 220 C735 220 750 155 785 155"/><path class="a" d="M695 475 C745 475 750 450 785 450"/><path class="a d" d="M925 245 L925 350"/>
</svg>
