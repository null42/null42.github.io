<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">第五章DTFT复盘概念地图</title><desc id="desc">从DTFS极限、单位圆、变换对和性质进入周期线谱、多速率、LTI系统、差分方程和数字控制。</desc><defs><style>.b{fill:#f7faff;stroke:#275dad;stroke-width:2;rx:16}.g{fill:#eef9f1;stroke:#23824b;stroke-width:2;rx:16}.o{fill:#fff5e8;stroke:#d87500;stroke-width:2;rx:16}.t{font:700 22px 'Microsoft YaHei',sans-serif;fill:#17335c}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#26384f}.a{stroke:#60738e;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#60738e"/></marker></defs><rect width="1200" height="760" fill="#fff"/>
<rect class="b" x="45" y="60" width="250" height="125"/><text class="t" x="170" y="101" text-anchor="middle">DTFS → DTFT</text><text class="s" x="170" y="137" text-anchor="middle">N→∞，Δω→0</text><text class="s" x="170" y="164" text-anchor="middle">离散序列 ↔ 连续周期谱</text>
<rect class="b" x="355" y="60" width="250" height="125"/><text class="t" x="480" y="101" text-anchor="middle">单位圆与2π周期</text><text class="s" x="480" y="137" text-anchor="middle">z=eʲᵠ</text><text class="s" x="480" y="164" text-anchor="middle">ω=ΩTₛ</text>
<rect class="b" x="665" y="60" width="250" height="125"/><text class="t" x="790" y="101" text-anchor="middle">变换对与性质</text><text class="s" x="790" y="137" text-anchor="middle">移位、差分、卷积</text><text class="s" x="790" y="164" text-anchor="middle">相乘、对称、Parseval</text>
<rect class="o" x="45" y="285" width="250" height="145"/><text class="t" x="170" y="327" text-anchor="middle">周期序列线谱</text><text class="s" x="170" y="364" text-anchor="middle">DTFS系数 aₖ</text><text class="s" x="170" y="393" text-anchor="middle">冲激权重 2πaₖ</text>
<rect class="o" x="355" y="285" width="250" height="145"/><text class="t" x="480" y="327" text-anchor="middle">多速率边界</text><text class="s" x="480" y="364" text-anchor="middle">插零 → 成像</text><text class="s" x="480" y="393" text-anchor="middle">抽取 → 混叠</text>
<rect class="b" x="665" y="285" width="250" height="145"/><text class="t" x="790" y="327" text-anchor="middle">LTI与差分方程</text><text class="s" x="790" y="364" text-anchor="middle">Y=XH</text><text class="s" x="790" y="393" text-anchor="middle">H(z)=B/A</text>
<rect class="o" x="950" y="285" width="210" height="145"/><text class="t" x="1055" y="327" text-anchor="middle">边界判断</text><text class="s" x="1055" y="361" text-anchor="middle">极点 + ROC</text><text class="s" x="1055" y="390" text-anchor="middle">因果性 + 稳定性</text>
<rect class="g" x="355" y="560" width="560" height="145"/><text class="t" x="635" y="605" text-anchor="middle">数字控制器设计与实现</text><text class="s" x="635" y="642" text-anchor="middle">频率归一化 · 延迟相位 · 极点零点 · 多速率 · 量化饱和</text><text class="s" x="635" y="674" text-anchor="middle">从C(z)展开差分方程，并用频域与时域双重验算</text>
