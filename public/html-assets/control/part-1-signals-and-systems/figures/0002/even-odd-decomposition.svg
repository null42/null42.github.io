<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">信号的奇偶分解</title><desc id="d">展示原信号、时间反转、奇部和偶部，并说明相加重构。</desc><rect width="1100" height="650" rx="24" fill="#fbfcfe"/><text x="550" y="42" text-anchor="middle" font-size="28" fill="#172033">xₒ(t)=[x(t)−x(−t)]/2　　xₑ(t)=[x(t)+x(−t)]/2</text><g transform="translate(55,95)"><text x="210" y="0" text-anchor="middle" font-size="22">x(t)</text><line x1="20" y1="175" x2="400" y2="175" stroke="#26364d" stroke-width="2"/><line x1="190" y1="210" x2="190" y2="35" stroke="#26364d" stroke-width="2"/><path d="M190 175 C220 75 255 75 290 175 C320 75 355 75 390 175" fill="none" stroke="#275dad" stroke-width="5"/></g><g transform="translate(625,95)"><text x="210" y="0" text-anchor="middle" font-size="22">x(−t)</text><line x1="20" y1="175" x2="400" y2="175" stroke="#26364d" stroke-width="2"/><line x1="210" y1="210" x2="210" y2="35" stroke="#26364d" stroke-width="2"/><path d="M10 175 C45 75 80 75 110 175 C145 75 180 75 210 175" fill="none" stroke="#d46b3c" stroke-width="5"/></g><g transform="translate(55,365)"><text x="210" y="0" text-anchor="middle" font-size="22">奇部 xₒ(t)</text><line x1="20" y1="135" x2="400" y2="135" stroke="#26364d" stroke-width="2"/><line x1="200" y1="235" x2="200" y2="25" stroke="#26364d" stroke-width="2"/><path d="M20 135 C55 185 90 185 120 135 C155 185 185 185 200 135 C230 85 265 85 300 135 C330 85 365 85 395 135" fill="none" stroke="#7c51b8" stroke-width="5"/></g><g transform="translate(625,365)"><text x="210" y="0" text-anchor="middle" font-size="22">偶部 xₑ(t)</text><line x1="20" y1="175" x2="400" y2="175" stroke="#26364d" stroke-width="2"/><line x1="210" y1="210" x2="210" y2="35" stroke="#26364d" stroke-width="2"/><path d="M20 175 C55 125 90 125 120 175 C155 125 185 125 210 175 C235 125 265 125 300 175 C330 125 365 125 400 175" fill="none" stroke="#2f8a61" stroke-width="5"/></g><text x="550" y="625" text-anchor="middle" font-size="20" fill="#5e6b7c">奇部关于原点反对称，偶部关于纵轴对称；逐点相加恢复原信号。</text></svg>
