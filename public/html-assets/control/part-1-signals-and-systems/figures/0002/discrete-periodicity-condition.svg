<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">离散复指数周期判据</title><desc id="d">角频率除以二派必须是有理数，最简分母决定基本周期。</desc><rect width="1000" height="520" rx="24" fill="#fbfcfe"/><text x="500" y="45" text-anchor="middle" font-size="28" fill="#172033">e^{jω₀n} 周期 ⇔ 存在正整数 N、整数 m 使 ω₀N=2πm</text><rect x="70" y="100" width="860" height="90" rx="15" fill="#edf3fb" stroke="#275dad" stroke-width="3"/><text x="500" y="145" text-anchor="middle" font-size="25">ω₀/(2π)=m/N ∈ ℚ</text><text x="500" y="177" text-anchor="middle" font-size="18" fill="#5e6b7c">写成最简分数 p/q 后，基本周期通常为 q</text><rect x="65" y="245" width="400" height="190" rx="18" fill="#eaf8f2" stroke="#39874b" stroke-width="3"/><text x="265" y="285" text-anchor="middle" font-size="24" fill="#245c31">cos(8πn/7+2)</text><text x="265" y="330" text-anchor="middle" font-size="21">ω₀/(2π)=4/7</text><text x="265" y="370" text-anchor="middle" font-size="21">4N/7=m</text><text x="265" y="410" text-anchor="middle" font-size="25" fill="#245c31">最小 N₀=7</text><rect x="535" y="245" width="400" height="190" rx="18" fill="#fff0f0" stroke="#c74d4d" stroke-width="3"/><text x="735" y="285" text-anchor="middle" font-size="24" fill="#8d3030">e^{j(n/8+π)}</text><text x="735" y="330" text-anchor="middle" font-size="21">ω₀/(2π)=1/(16π)</text><text x="735" y="370" text-anchor="middle" font-size="21">不是有理数</text><text x="735" y="410" text-anchor="middle" font-size="25" fill="#8d3030">不存在整数周期 N</text><text x="500" y="485" text-anchor="middle" font-size="18" fill="#5e6b7c">常相位只旋转整条序列，不改变周期判据。</text></svg>
