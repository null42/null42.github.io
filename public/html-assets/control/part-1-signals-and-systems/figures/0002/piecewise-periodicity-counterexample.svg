<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">分段周期反例</title><desc id="d">负半轴余弦与正半轴正弦各自周期，但拼接点平移后不重复。</desc><rect width="1000" height="430" rx="24" fill="#fbfcfe"/><text x="500" y="42" text-anchor="middle" font-size="27" fill="#172033">局部都以 2π 重复，不代表拼接后的整体周期</text><line x1="60" y1="245" x2="940" y2="245" stroke="#26364d" stroke-width="2"/><line x1="500" y1="350" x2="500" y2="85" stroke="#26364d" stroke-width="2"/><path d="M70 245 C105 145 140 145 175 245 S245 345 280 245 S350 145 385 245 S455 345 490 245" fill="none" stroke="#275dad" stroke-width="5"/><path d="M500 245 C535 145 570 145 605 245 S675 345 710 245 S780 145 815 245 S885 345 920 245" fill="none" stroke="#d46b3c" stroke-width="5"/><circle cx="500" cy="245" r="7" fill="#d46b3c"/><circle cx="280" cy="145" r="7" fill="#275dad"/><path d="M280 125V85M500 225V85" stroke="#c74d4d" stroke-width="2" stroke-dasharray="7 6"/><text x="280" y="74" text-anchor="middle" font-size="18" fill="#c74d4d">x(−2π)=1</text><text x="500" y="74" text-anchor="middle" font-size="18" fill="#c74d4d">x(0)=0</text><text x="250" y="395" text-anchor="middle" font-size="20" fill="#275dad">t&lt;0：cos t</text><text x="750" y="395" text-anchor="middle" font-size="20" fill="#d46b3c">t≥0：sin t</text><text x="500" y="330" text-anchor="middle" font-size="18" fill="#5e6b7c">若 2π 是周期，应有 x(0)=x(−2π)，但 0≠1。</text></svg>
