<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">连续多频率公共周期</title><desc id="d">通过整数方程求余弦二倍频与正弦三倍频的公共周期。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#52627a"/></marker></defs><rect width="1000" height="470" rx="24" fill="#fbfcfe"/><text x="500" y="45" text-anchor="middle" font-size="28" fill="#172033">x(t)=cos2t+sin3t：公共周期必须同时满足两条整数条件</text><rect x="70" y="105" width="300" height="120" rx="16" fill="#eaf2ff" stroke="#275dad" stroke-width="3"/><text x="220" y="150" text-anchor="middle" font-size="24" fill="#17477e">cos2t</text><text x="220" y="192" text-anchor="middle" font-size="23">2T=2πk₁ ⇒ T=πk₁</text><rect x="630" y="105" width="300" height="120" rx="16" fill="#fff2df" stroke="#d46b3c" stroke-width="3"/><text x="780" y="150" text-anchor="middle" font-size="24" fill="#8c3f1e">sin3t</text><text x="780" y="192" text-anchor="middle" font-size="23">3T=2πk₂ ⇒ T=2πk₂/3</text><path d="M370 165H480" stroke="#52627a" stroke-width="3" marker-end="url(#a)"/><path d="M630 165H520" stroke="#52627a" stroke-width="3" marker-end="url(#a)"/><rect x="355" y="280" width="290" height="110" rx="18" fill="#eaf8f2" stroke="#39874b" stroke-width="3"/><text x="500" y="325" text-anchor="middle" font-size="22">3k₁=2k₂</text><text x="500" y="365" text-anchor="middle" font-size="25" fill="#245c31">最小 k₁=2，k₂=3</text><text x="500" y="435" text-anchor="middle" font-size="25" fill="#172033">所以基本周期 T₀=2π</text></svg>
