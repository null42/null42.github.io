<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">线性反馈系统复盘概念图</title><desc id="desc">从反馈方框图经过特征方程进入根轨迹和Nyquist，再连接数字实现与工程验收。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#275dad"/></marker></defs><rect width="1200" height="720" fill="#f7f9fc"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="55" font-size="28" font-weight="700" fill="#172033">第十一章：反馈设计的统一推理链</text><text x="60" y="84" font-size="16" fill="#657184">每一步都必须回到信号注入点、特征方程和实现约束</text><g stroke="#c8d5e5" stroke-width="2" fill="#fff"><rect x="60" y="150" width="210" height="115" rx="16"/><rect x="350" y="150" width="210" height="115" rx="16"/><rect x="640" y="150" width="210" height="115" rx="16"/><rect x="930" y="150" width="210" height="115" rx="16"/><rect x="185" y="430" width="250" height="115" rx="16"/><rect x="555" y="430" width="250" height="115" rx="16"/><rect x="925" y="430" width="210" height="115" rx="16"/></g><g fill="#172033" text-anchor="middle"><text x="165" y="190" font-size="20" font-weight="700">反馈方框图</text><text x="165" y="220" font-size="16">e=r−Hy，y=Ge</text><text x="165" y="245" font-size="15">明确输入/扰动/噪声</text><text x="455" y="190" font-size="20" font-weight="700">灵敏度与权衡</text><text x="455" y="220" font-size="16">S=1/(1+L)，T=L/(1+L)</text><text x="455" y="245" font-size="15">性能与稳定风险并存</text><text x="745" y="190" font-size="20" font-weight="700">特征方程</text><text x="745" y="220" font-size="16">1+L(s)=0 或 1+L(z)=0</text><text x="745" y="245" font-size="15">闭环极点的来源</text><text x="1035" y="190" font-size="20" font-weight="700">几何判据</text><text x="1035" y="220" font-size="16">根轨迹 / Nyquist</text><text x="1035" y="245" font-size="15">参数移动与稳定边界</text><text x="310" y="470" font-size="20" font-weight="700">连续域</text><text x="310" y="500" font-size="16">左半平面、虚轴围线</text><text x="310" y="525" font-size="15">延迟使相位裕度消耗</text><text x="680" y="470" font-size="20" font-weight="700">离散域</text><text x="680" y="500" font-size="16">单位圆内、z平面围线</text><text x="680" y="525" font-size="15">采样与计算延迟必须显式建模</text><text x="1030" y="470" font-size="20" font-weight="700">工程验收</text><text x="1030" y="500" font-size="16">饱和/噪声/摄动/复位</text><text x="1030" y="525" font-size="15">名义稳定不等于可部署</text></g><g stroke="#275dad" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M270 207 H350"/><path d="M560 207 H640"/><path d="M850 207 H930"/><path d="M1035 265 V390 H680 V430"/><path d="M955 265 V390 H310 V430"/><path d="M435 487 H555"/><path d="M805 487 H925"/></g><g fill="#e7f0ff" stroke="#275dad" stroke-width="2"><circle cx="455" cy="350" r="34"/><circle cx="745" cy="350" r="34"/></g><g fill="#275dad" text-anchor="middle"><text x="455" y="357" font-size="16">S+T=1</text><text x="745" y="357" font-size="16">−1点</text></g></g></svg>
