<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">常系数微分方程到频率响应与冲激响应的映射</title><desc id="desc">展示物理微分方程经复指数特征函数或傅里叶微分性质得到频率响应，再由极零点和部分分式得到冲激响应及控制指标。</desc>
  <defs><style>.bg{fill:#f7fafc}.box{fill:#fff;stroke:#315b7d;stroke-width:2}.accent{fill:#e8f3ff;stroke:#1877b9;stroke-width:2}.warn{fill:#fff4df;stroke:#b76b00;stroke-width:2}.t{font:700 24px 'Microsoft YaHei',sans-serif;fill:#17324d}.s{font:18px 'Microsoft YaHei',sans-serif;fill:#243b53}.f{font:19px Consolas,'Microsoft YaHei',sans-serif;fill:#102a43}.a{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#315b7d"/></marker></defs>
  <rect class="bg" width="1200" height="560" rx="24"/><text class="t" x="42" y="48">微分方程 → 频率响应 → 模态 → 控制解释</text>
  <rect class="box" x="42" y="92" width="265" height="150" rx="16"/><text class="t" x="68" y="128">时域模型</text><text class="f" x="68" y="168">Σaₖ y⁽ᵏ⁾ = Σbₖ x⁽ᵏ⁾</text><text class="s" x="68" y="207">常系数：时不变</text><text class="s" x="68" y="232">线性组合：线性</text>
  <rect class="accent" x="357" y="92" width="270" height="150" rx="16"/><text class="t" x="382" y="128">两条等价路径</text><text class="s" x="382" y="168">① eʲωᵗ 是LTI特征函数</text><text class="s" x="382" y="203">② dᵏ/dtᵏ ↔ (jω)ᵏ</text><text class="s" x="382" y="232">微分算子被对角化</text>
  <rect class="box" x="677" y="92" width="475" height="150" rx="16"/><text class="t" x="702" y="128">频率响应</text><text class="f" x="702" y="171">H(jω)=Σbₖ(jω)ᵏ / Σaₖ(jω)ᵏ</text><text class="s" x="702" y="207">分母根：自然模态 / 极点</text><text class="s" x="702" y="232">分子根：传输零点 / 模态权重</text>
  <path class="a" d="M307 167 H347"/><path class="a" d="M627 167 H667"/>
  <rect class="accent" x="42" y="310" width="340" height="160" rx="16"/><text class="t" x="68" y="348">因式分解与部分分式</text><text class="f" x="68" y="389">H(s)=Σ rᵢ/(s−pᵢ)</text><text class="s" x="68" y="425">pᵢ 决定衰减/振荡速率</text><text class="s" x="68" y="454">rᵢ 决定模态可见程度</text>
  <rect class="box" x="432" y="310" width="315" height="160" rx="16"/><text class="t" x="458" y="348">单位冲激响应</text><text class="f" x="458" y="389">h(t)=Σ rᵢeᵖⁱᵗu(t)</text><text class="s" x="458" y="425">因果性选择右边序列</text><text class="s" x="458" y="454">∫h(t)dt = H(0) 验算</text>
  <rect class="warn" x="797" y="310" width="355" height="160" rx="16"/><text class="t" x="823" y="348">稳定与控制指标</text><text class="s" x="823" y="389">左半平面极点 → 衰减与BIBO稳定</text><text class="s" x="823" y="425">时间常数、带宽、直流增益、相位</text><text class="s" x="823" y="454">初值与延迟必须另外说明</text>
  <path class="a" d="M915 242 V275 H212 V300"/><path class="a" d="M382 390 H422"/><path class="a" d="M747 390 H787"/><text class="s" x="42" y="526">核心检查：零状态假设 · 2π/量纲 · H(0)=∫h · 高频相对阶次 · 极点位置与稳定性一致</text>
</svg>
