<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">连续时间傅里叶变换章节复盘总图</title><desc id="desc">从CTFS极限到CTFT定义、变换对、性质、广义函数、能量、LTI系统、控制迁移和采样的整体关系。</desc>
  <defs><style>.bg{fill:#f6f9fc}.core{fill:#e6f3ff;stroke:#116aa3;stroke-width:3}.box{fill:#fff;stroke:#355a75;stroke-width:2}.edge{stroke:#355a75;stroke-width:3;fill:none;marker-end:url(#a)}.title{font:700 27px 'Microsoft YaHei',sans-serif;fill:#17324d}.head{font:700 21px 'Microsoft YaHei',sans-serif;fill:#17324d}.text{font:17px 'Microsoft YaHei',sans-serif;fill:#243b53}.formula{font:17px Consolas,'Microsoft YaHei',sans-serif;fill:#102a43}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#355a75"/></marker></defs>
  <rect class="bg" width="1400" height="820" rx="24"/><text class="title" x="42" y="48">第四章工作系统：表示 → 运算 → 系统 → 控制与采样</text>
  <rect class="box" x="45" y="90" width="290" height="155" rx="16"/><text class="head" x="68" y="125">CTFS无限周期极限</text><text class="text" x="68" y="162">Δω=2π/T → 0</text><text class="text" x="68" y="194">Taₖ → X(jω)</text><text class="text" x="68" y="226">离散和 → 黎曼积分</text>
  <rect class="core" x="385" y="80" width="410" height="175" rx="18"/><text class="head" x="410" y="120">CTFT连续频率坐标</text><text class="formula" x="410" y="158">X(jω)=∫x(t)e⁻ʲωᵗdt</text><text class="formula" x="410" y="195">x(t)=1/(2π)∫X(jω)eʲωᵗdω</text><text class="text" x="410" y="230">频谱密度 · 2π归一化 · 收敛口径</text>
  <rect class="box" x="845" y="90" width="510" height="155" rx="16"/><text class="head" x="870" y="125">周期信号与分布</text><text class="formula" x="870" y="162">X=Σ2πaₖδ(ω−kω₀)</text><text class="text" x="870" y="194">阶跃：πδ + PV[1/(jω)]</text><text class="text" x="870" y="226">冲激、主值、普通函数边界</text>
  <path class="edge" d="M335 168 H375"/><path class="edge" d="M795 168 H835"/>
  <rect class="box" x="45" y="325" width="300" height="205" rx="16"/><text class="head" x="68" y="362">种子变换对</text><text class="text" x="68" y="400">δ ↔ 1</text><text class="text" x="68" y="432">右边指数 ↔ 一阶有理式</text><text class="text" x="68" y="464">矩形 ↔ sinc</text><text class="text" x="68" y="496">复指数 ↔ 频移冲激</text>
  <rect class="box" x="385" y="305" width="410" height="245" rx="16"/><text class="head" x="410" y="342">性质生成网络</text><text class="text" x="410" y="380">时移 · 尺度 · 共轭对称</text><text class="text" x="410" y="412">微分 · 积分 · 乘t · 对偶</text><text class="text" x="410" y="444">卷积：x*h ↔ XH</text><text class="text" x="410" y="476">相乘：x₁x₂ ↔ (X₁*X₂)/(2π)</text><text class="text" x="410" y="508">调制：频谱搬移</text>
  <rect class="box" x="835" y="325" width="520" height="205" rx="16"/><text class="head" x="860" y="362">能量、功率与验算</text><text class="formula" x="860" y="400">E=1/(2π)∫|X|²dω</text><text class="text" x="860" y="432">周期功率：P=Σ|aₖ|²</text><text class="text" x="860" y="464">X(0)=∫x，H(0)=∫h</text><text class="text" x="860" y="496">对称、量纲、高频阶次、极点</text>
  <path class="edge" d="M590 255 V295"/><path class="edge" d="M385 427 H355"/><path class="edge" d="M795 427 H825"/>
  <rect class="core" x="95" y="640" width="530" height="130" rx="18"/><text class="head" x="120" y="678">LTI系统与常系数微分方程</text><text class="formula" x="120" y="716">Y=XH，H=Σbₖ(jω)ᵏ/Σaₖ(jω)ᵏ</text><text class="text" x="120" y="750">极点定模态 · 零点/留数定通道表现 · 因果与稳定</text>
  <rect class="core" x="775" y="640" width="530" height="130" rx="18"/><text class="head" x="800" y="678">控制迁移与数字入口</text><text class="text" x="800" y="716">延迟相位 · 同步调制 · 频率加权</text><text class="text" x="800" y="750">冲激串采样 → 频谱复制 → 混叠与DTFT周期性</text>
  <path class="edge" d="M500 550 V605 H360 V630"/><path class="edge" d="M680 550 V605 H1040 V630"/><path class="edge" d="M625 705 H765"/>
</svg>
