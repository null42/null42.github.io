<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">从CTFS到CTFT及周期冲激谱</title><desc id="d">周期增大使谱线加密，Ta_k形成连续频谱；周期信号则在CTFT中表示为冲激线谱。</desc><rect width="1200" height="650" rx="24" fill="#0b1f33"/><g font-family="Microsoft YaHei,sans-serif"><text x="600" y="48" fill="white" font-size="29" text-anchor="middle">CTFS → 周期极限 → CTFT → 周期冲激谱</text><g fill="#12314d" stroke-width="3"><rect x="45" y="105" width="260" height="180" rx="18" stroke="#60a5fa"/><rect x="335" y="105" width="260" height="180" rx="18" stroke="#38bdf8"/><rect x="625" y="105" width="260" height="180" rx="18" stroke="#34d399"/><rect x="915" y="105" width="240" height="180" rx="18" stroke="#fbbf24"/></g><g fill="white" font-size="17"><text x="175" y="145" fill="#93c5fd" font-size="21" text-anchor="middle">周期延拓</text><text x="72" y="185">ω₀=2π/T</text><text x="72" y="220">aₖ=X(jkω₀)/T</text><text x="72" y="255">谱线离散</text><text x="465" y="145" fill="#7dd3fc" font-size="21" text-anchor="middle">T趋于无穷</text><text x="362" y="185">ω₀趋于0</text><text x="362" y="220">Taₖ形成包络</text><text x="362" y="255">求和成为积分</text><text x="755" y="145" fill="#6ee7b7" font-size="21" text-anchor="middle">非周期CTFT</text><text x="652" y="185">X(jω)=积分</text><text x="652" y="220">连续频谱密度</text><text x="652" y="255">反变换重构</text><text x="1035" y="145" fill="#fde68a" font-size="21" text-anchor="middle">周期信号</text><text x="940" y="185">广义函数CTFT</text><text x="940" y="220">位置kω₀</text><text x="940" y="255">面积2πaₖ</text></g><path d="M305 195h30M595 195h30M885 195h30" stroke="#93c5fd" stroke-width="5"/><rect x="90" y="360" width="300" height="170" rx="18" fill="#10283e" stroke="#60a5fa" stroke-width="3"/><text x="240" y="400" fill="#93c5fd" font-size="21" text-anchor="middle">基本变换对</text><text x="120" y="442" fill="white" font-size="17">冲激 ↔ 常数</text><text x="120" y="478" fill="white" font-size="17">矩形 ↔ sinc</text><text x="120" y="514" fill="white" font-size="17">指数 ↔ 一阶频谱</text><rect x="450" y="360" width="300" height="170" rx="18" fill="#10283e" stroke="#34d399" stroke-width="3"/><text x="600" y="400" fill="#6ee7b7" font-size="21" text-anchor="middle">严格边界</text><text x="480" y="442" fill="white" font-size="17">L1 / L2充分条件</text><text x="480" y="478" fill="white" font-size="17">分布极限与冲激面积</text><text x="480" y="514" fill="white" font-size="17">2π归一化一致性</text><rect x="810" y="360" width="300" height="170" rx="18" fill="#10283e" stroke="#fbbf24" stroke-width="3"/><text x="960" y="400" fill="#fde68a" font-size="21" text-anchor="middle">控制迁移</text><text x="840" y="442" fill="white" font-size="17">带宽与时间分辨率</text><text x="840" y="478" fill="white" font-size="17">周期扰动与谐振控制</text><text x="840" y="514" fill="white" font-size="17">冲激采样与混叠</text><text x="600" y="610" fill="white" font-size="19" text-anchor="middle">统一口径：系数是离散坐标，频谱是连续密度，周期CTFT冲激权重是2π倍坐标</text></g></svg>
