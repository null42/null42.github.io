<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">CTFT性质选择地图</title><desc id="d">从信号操作选择线性、时移、共轭、奇偶、微积分、尺度和对偶性质，并检查边界。</desc><rect width="1200" height="650" rx="24" fill="#0b1f33"/><g font-family="Microsoft YaHei,sans-serif"><text x="600" y="48" fill="white" font-size="29" text-anchor="middle">CTFT性质：操作 → 频域动作 → 边界检查</text><g fill="#12314d" stroke-width="3"><rect x="45" y="100" width="250" height="170" rx="18" stroke="#60a5fa"/><rect x="325" y="100" width="250" height="170" rx="18" stroke="#38bdf8"/><rect x="605" y="100" width="250" height="170" rx="18" stroke="#34d399"/><rect x="885" y="100" width="270" height="170" rx="18" stroke="#fbbf24"/></g><g fill="white" font-size="16"><text x="170" y="138" fill="#93c5fd" font-size="21" text-anchor="middle">结构性质</text><text x="70" y="178">线性：谱线性组合</text><text x="70" y="212">时移：乘线性相位</text><text x="70" y="246">共轭：共轭并反频</text><text x="450" y="138" fill="#7dd3fc" font-size="21" text-anchor="middle">实性与奇偶</text><text x="350" y="178">实信号：共轭对称</text><text x="350" y="212">实偶：实偶频谱</text><text x="350" y="246">实奇：纯虚奇频谱</text><text x="730" y="138" fill="#6ee7b7" font-size="21" text-anchor="middle">微积分</text><text x="630" y="178">微分：乘jω</text><text x="630" y="212">积分：除jω加冲激</text><text x="630" y="246">乘t：频谱求导</text><text x="1020" y="138" fill="#fde68a" font-size="21" text-anchor="middle">尺度与对偶</text><text x="910" y="178">缩放：1/|a|与ω/a</text><text x="910" y="212">反转：ω反转</text><text x="910" y="246">对偶：交换+反转+2π</text></g><rect x="90" y="345" width="300" height="180" rx="18" fill="#10283e" stroke="#60a5fa" stroke-width="3"/><text x="240" y="385" fill="#93c5fd" font-size="21" text-anchor="middle">先预判</text><text x="120" y="427" fill="white" font-size="17">实/复、奇/偶、移位</text><text x="120" y="463" fill="white" font-size="17">幅值、相位、支撑</text><text x="120" y="499" fill="white" font-size="17">零频面积与对称性</text><rect x="450" y="345" width="300" height="180" rx="18" fill="#10283e" stroke="#34d399" stroke-width="3"/><text x="600" y="385" fill="#6ee7b7" font-size="21" text-anchor="middle">再运算</text><text x="480" y="427" fill="white" font-size="17">模板 → 尺度 → 反转</text><text x="480" y="463" fill="white" font-size="17">移位 → 调制 → 线性</text><text x="480" y="499" fill="white" font-size="17">必要时微分或积分</text><rect x="810" y="345" width="300" height="180" rx="18" fill="#10283e" stroke="#fbbf24" stroke-width="3"/><text x="960" y="385" fill="#fde68a" font-size="21" text-anchor="middle">最后审计</text><text x="840" y="427" fill="white" font-size="17">2π、绝对值、符号</text><text x="840" y="463" fill="white" font-size="17">直流冲激与主值项</text><text x="840" y="499" fill="white" font-size="17">收敛、因果与可实现性</text><text x="600" y="605" fill="white" font-size="19" text-anchor="middle">控制迁移：延迟相位 · 带限微分 · 积分状态 · 命令加速的高频代价</text></g></svg>
