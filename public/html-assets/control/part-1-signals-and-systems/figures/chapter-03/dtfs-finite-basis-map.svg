<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">DTFS有限基与精确重构图</title><desc id="desc">展示离散复指数按N重复、有限正交分析、N个系数和精确合成之间的关系。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#294d68"/></marker><style>.bg{fill:#fbfdff}.blue{fill:#eaf3ff;stroke:#2864ad;stroke-width:3}.green{fill:#ecf8f0;stroke:#2b824d;stroke-width:3}.orange{fill:#fff3dc;stroke:#b56c00;stroke-width:3}.purple{fill:#f3efff;stroke:#7552aa;stroke-width:3}.line{stroke:#294d68;stroke-width:3;fill:none;marker-end:url(#arr)}.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:22px}.h{font-size:34px;font-weight:700}.m{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:25px}.s{font-size:18px;fill:#49687d}</style></defs><rect width="1280" height="800" class="bg"/><text x="42" y="54" class="t h">DTFS：N 个样本 ↔ N 个独立复指数 ↔ N 个周期系数</text><rect x="55" y="100" width="360" height="125" rx="17" class="blue"/><text x="85" y="145" class="t">离散基函数按索引回绕</text><text x="85" y="185" class="m">φₖ₊N[n]=φₖ[n]</text><path d="M415 162H500" class="line"/><rect x="500" y="100" width="300" height="125" rx="17" class="green"/><text x="548" y="145" class="t">仅 N 个独立基</text><text x="535" y="185" class="t s">任选 N 个连续 k 覆盖全部模 N 类</text><path d="M800 162H885" class="line"/><rect x="885" y="100" width="340" height="125" rx="17" class="orange"/><text x="930" y="145" class="t">N 周期系数序列</text><text x="955" y="185" class="m">aₖ₊N=aₖ</text><text x="55" y="300" class="t h">分析：有限正交投影</text><rect x="55" y="340" width="520" height="135" rx="17" class="purple"/><text x="88" y="388" class="m">aᵣ=(1/N)Σₙ x[n]e⁻ʲʳ²πⁿ/ᴺ</text><text x="88" y="430" class="t s">目标基与自身内积为 N；与其余基内积为 0</text><path d="M575 407H705" class="line"/><rect x="705" y="340" width="520" height="135" rx="17" class="green"/><text x="745" y="388" class="m">Σₙeʲ⁽ᵏ⁻ʳ⁾²πⁿ/ᴺ=Nδₖᵣ</text><text x="745" y="430" class="t s">有限几何和：q=1 与 q≠1 必须分开</text><text x="55" y="545" class="t h">合成：完整 N 项精确恢复</text><rect x="55" y="585" width="520" height="140" rx="17" class="blue"/><text x="90" y="635" class="m">x̂[n]=Σₖ₌〈ᴺ〉aₖeʲᵏ²πⁿ/ᴺ</text><text x="90" y="680" class="t s">奇数 N：−(N−1)/2…(N−1)/2</text><path d="M575 655H705" class="line"/><rect x="705" y="585" width="520" height="140" rx="17" class="orange"/><text x="850" y="635" class="m">x̂[n]=x[n]</text><text x="745" y="680" class="t s">有限维可逆变换：无无穷极限、无完整表示的 Gibbs</text><text x="360" y="770" class="t s">部分系数 = 有意降阶；完整 N 个独立系数 = 每个整数样本严格重构</text></svg>
