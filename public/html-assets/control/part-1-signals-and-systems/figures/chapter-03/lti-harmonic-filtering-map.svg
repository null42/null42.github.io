<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">LTI逐谐波滤波统一图</title><desc id="desc">展示连续和离散周期信号通过LTI系统时，每条谐波乘以对应频率响应的统一关系。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#294d68"/></marker><style>.bg{fill:#fbfdff}.b{fill:#eaf3ff;stroke:#2864ad;stroke-width:3}.g{fill:#ecf8f0;stroke:#2b824d;stroke-width:3}.o{fill:#fff3dc;stroke:#b56c00;stroke-width:3}.p{fill:#f3efff;stroke:#7552aa;stroke-width:3}.l{stroke:#294d68;stroke-width:3;fill:none;marker-end:url(#a)}.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:22px}.h{font-size:34px;font-weight:700}.m{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:25px}.s{font-size:18px;fill:#49687d}</style></defs><rect width="1280" height="780" class="bg"/><text x="42" y="54" class="t h">周期信号 + LTI：复指数不换频，只乘对应频响</text><rect x="55" y="100" width="350" height="145" rx="17" class="b"/><text x="88" y="145" class="t">连续周期输入</text><text x="80" y="185" class="m">x(t)=Σaₖeʲᵏω⁰ᵗ</text><text x="80" y="222" class="t s">第k条谱线位于ω=kω₀</text><path d="M405 172H500" class="l"/><rect x="500" y="100" width="280" height="145" rx="17" class="o"/><text x="570" y="145" class="t">连续LTI</text><text x="542" y="185" class="m">H(jkω₀)</text><text x="535" y="222" class="t s">虚轴取样：增益+相位</text><path d="M780 172H875" class="l"/><rect x="875" y="100" width="350" height="145" rx="17" class="g"/><text x="908" y="145" class="t">输出系数</text><text x="900" y="185" class="m">bₖ=aₖH(jkω₀)</text><text x="900" y="222" class="t s">频率位置不变，复幅值改变</text><rect x="55" y="330" width="350" height="145" rx="17" class="b"/><text x="88" y="375" class="t">离散周期输入</text><text x="80" y="415" class="m">x[n]=Σaₖeʲᵏ²πⁿ/ᴺ</text><text x="80" y="452" class="t s">第k条谱线在单位圆角度2πk/N</text><path d="M405 402H500" class="l"/><rect x="500" y="330" width="280" height="145" rx="17" class="o"/><text x="565" y="375" class="t">离散LTI</text><text x="535" y="415" class="m">H(eʲᵠ)</text><text x="535" y="452" class="t s">单位圆取样：增益+相位</text><path d="M780 402H875" class="l"/><rect x="875" y="330" width="350" height="145" rx="17" class="g"/><text x="908" y="375" class="t">输出系数</text><text x="890" y="415" class="m">bₖ=aₖH(eʲ²πᵏ/ᴺ)</text><text x="900" y="452" class="t s">周期性与共轭对称保留</text><rect x="195" y="560" width="890" height="125" rx="18" class="p"/><text x="260" y="605" class="t">共同边界：系统必须是LTI，频响必须存在于虚轴/单位圆</text><text x="260" y="645" class="t s">若有时变、非线性或混叠，就会出现频率搬移、谱线耦合或新谐波</text><text x="320" y="730" class="t s">控制迁移：逐谐波检查跟踪、扰动抑制、噪声传递和执行器负担</text></svg>
