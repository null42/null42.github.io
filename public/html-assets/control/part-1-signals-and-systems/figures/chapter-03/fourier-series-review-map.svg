<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">第三章傅里叶级数概念地图</title><desc id="desc">从周期信号经正交基、傅里叶坐标、收敛与性质，到LTI逐谐波和滤波控制设计。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#183650"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, sans-serif"><text x="600" y="48" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">周期信号的傅里叶级数：一套可推导的工作系统</text>
  <g fill="#102a43" stroke-width="3"><rect x="35" y="105" width="210" height="150" rx="18" stroke="#60a5fa"/><rect x="275" y="105" width="210" height="150" rx="18" stroke="#38bdf8"/><rect x="515" y="105" width="210" height="150" rx="18" stroke="#34d399"/><rect x="755" y="105" width="210" height="150" rx="18" stroke="#fbbf24"/><rect x="995" y="105" width="170" height="150" rx="18" stroke="#fb7185"/></g>
  <g text-anchor="middle"><text x="140" y="143" fill="#93c5fd" font-size="21">周期与谐波基</text><text x="140" y="180" fill="#fff" font-size="16">CT：kω₀</text><text x="140" y="210" fill="#fff" font-size="16">DT：2πk/N</text><text x="380" y="143" fill="#7dd3fc" font-size="21">正交分析</text><text x="380" y="180" fill="#fff" font-size="16">积分 / 有限求和</text><text x="380" y="210" fill="#fff" font-size="16">提取坐标 aₖ</text><text x="620" y="143" fill="#6ee7b7" font-size="21">合成与收敛</text><text x="620" y="180" fill="#fff" font-size="16">CTFS：无限级数</text><text x="620" y="210" fill="#fff" font-size="16">DTFS：N维精确</text><text x="860" y="143" fill="#fde68a" font-size="21">性质与验算</text><text x="860" y="180" fill="#fff" font-size="16">对称、移位、差分</text><text x="860" y="210" fill="#fff" font-size="16">Parseval功率</text><text x="1080" y="143" fill="#fda4af" font-size="21">LTI系统</text><text x="1080" y="180" fill="#fff" font-size="16">bₖ=aₖHₖ</text><text x="1080" y="210" fill="#fff" font-size="16">逐谐波塑形</text></g>
  <g stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"><path d="M245 180h30"/><path d="M485 180h30"/><path d="M725 180h30"/><path d="M965 180h30"/></g>
  <rect x="80" y="330" width="300" height="210" rx="20" fill="#10283e" stroke="#60a5fa" stroke-width="3"/><text x="230" y="370" fill="#93c5fd" font-size="22" text-anchor="middle">连续 CTFS</text><text x="110" y="410" fill="#fff" font-size="16">间断点：左右极限平均</text><text x="110" y="445" fill="#fff" font-size="16">有限截断：Gibbs振铃</text><text x="110" y="480" fill="#fff" font-size="16">光滑度决定高频衰减</text><text x="110" y="515" fill="#fff" font-size="16">虚轴读取 H(jω)</text>
  <rect x="450" y="330" width="300" height="210" rx="20" fill="#10283e" stroke="#34d399" stroke-width="3"/><text x="600" y="370" fill="#6ee7b7" font-size="22" text-anchor="middle">离散 DTFS</text><text x="480" y="410" fill="#fff" font-size="16">只有N个独立复指数</text><text x="480" y="445" fill="#fff" font-size="16">系数按N周期重复</text><text x="480" y="480" fill="#fff" font-size="16">完整N项精确重构</text><text x="480" y="515" fill="#fff" font-size="16">单位圆读取 H(eʲω)</text>
  <rect x="820" y="330" width="300" height="210" rx="20" fill="#10283e" stroke="#fbbf24" stroke-width="3"/><text x="970" y="370" fill="#fde68a" font-size="22" text-anchor="middle">滤波与控制</text><text x="850" y="410" fill="#fff" font-size="16">RC低通 / 高通</text><text x="850" y="445" fill="#fff" font-size="16">IIR极点 / FIR零点</text><text x="850" y="480" fill="#fff" font-size="16">谐波抑制 / 灵敏度</text><text x="850" y="515" fill="#fff" font-size="16">相位裕度 / 延迟 / 字长</text>
  <path d="M230 560v50h740v-50" fill="none" stroke="#64748b" stroke-width="3"/><text x="600" y="645" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">最终能力：时域波形 ⇄ 傅里叶坐标 ⇄ 系统频响 ⇄ 可实现控制结构</text></g>
</svg>
