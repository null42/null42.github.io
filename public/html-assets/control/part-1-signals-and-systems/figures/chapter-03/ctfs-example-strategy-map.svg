<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">CTFS综合例题策略图</title><desc id="desc">展示从波形识别出发，选择直接积分、性质迁移、微分冲激链或系数约束反推的四条路径，并在直流与结构校验处汇合。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#274b68"/></marker><style>.bg{fill:#fbfdff}.root{fill:#e8f1ff;stroke:#245fa8;stroke-width:3}.a{fill:#fff3dc;stroke:#b46a00;stroke-width:3}.b{fill:#ecf8f0;stroke:#2c824d;stroke-width:3}.c{fill:#f4efff;stroke:#7653aa;stroke-width:3}.d{fill:#fff0f0;stroke:#b44848;stroke-width:3}.check{fill:#eef7fa;stroke:#277284;stroke-width:3}.line{stroke:#274b68;stroke-width:3;fill:none;marker-end:url(#arrow)}.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:22px}.h{font-size:34px;font-weight:700}.m{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:24px}.s{font-size:18px;fill:#48677d}</style></defs><rect width="1280" height="780" class="bg"/><text x="45" y="54" class="t h">CTFS 综合例题：先识别结构，再选择最短推导路径</text><rect x="420" y="92" width="440" height="100" rx="18" class="root"/><text x="470" y="133" class="t">① 写出波形关系与已知条件</text><text x="465" y="167" class="t s">周期 · 对称性 · 支集 · 时移 · 跳变 · 带限</text><path d="M640 192V235" class="line"/><path d="M640 215H160V270" class="line"/><path d="M640 215H470V270" class="line"/><path d="M640 215H800V270" class="line"/><path d="M640 215H1110V270" class="line"/><rect x="35" y="270" width="250" height="180" rx="16" class="a"/><text x="70" y="310" class="t">A 直接积分</text><text x="58" y="348" class="t s">支集简单、分段少</text><text x="58" y="384" class="m">aₖ=(1/T)∫x e⁻ʲᵏω⁰ᵗdt</text><text x="58" y="422" class="t s">矩形脉冲母题</text><rect x="345" y="270" width="250" height="180" rx="16" class="b"/><text x="380" y="310" class="t">B 性质迁移</text><text x="367" y="348" class="t s">时移 + 线性 + 去直流</text><text x="367" y="384" class="m">e⁻ʲᵏω⁰ᵗ⁰aₖ</text><text x="367" y="422" class="t s">例3.6 双极性方波</text><rect x="685" y="270" width="250" height="180" rx="16" class="c"/><text x="720" y="310" class="t">C 微分/冲激链</text><text x="707" y="348" class="t s">导数更简单或边沿稀疏</text><text x="707" y="384" class="m">X′ₖ=jkω₀Xₖ</text><text x="707" y="422" class="t s">三角波、矩形波边沿</text><rect x="995" y="270" width="250" height="180" rx="16" class="d"/><text x="1030" y="310" class="t">D 约束反推</text><text x="1017" y="348" class="t s">带限 + 实性 + 奇偶 + 功率</text><text x="1017" y="384" class="m">P=Σ|aₖ|²</text><text x="1017" y="422" class="t s">例3.9 有限维两解</text><path d="M160 450V520H510" class="line"/><path d="M470 450V520H560" class="line"/><path d="M810 450V520H720" class="line"/><path d="M1120 450V520H770" class="line"/><rect x="410" y="520" width="460" height="105" rx="18" class="check"/><text x="465" y="560" class="t">② 单独恢复直流 a₀</text><text x="455" y="598" class="t s">微分不能给 a₀；常数只作用于 k=0；平均值直接积分</text><path d="M640 625V665" class="line"/><rect x="250" y="665" width="780" height="82" rx="16" class="root"/><text x="300" y="702" class="t">③ 三重自检：波形对称性 ↔ 系数结构 · Parseval 功率 · 回代时域操作</text><text x="410" y="732" class="t s">若只确定模长或平方量，主动检查是否存在 ± 两解</text></svg>
