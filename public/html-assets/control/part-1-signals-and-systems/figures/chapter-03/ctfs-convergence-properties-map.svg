<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">CTFS收敛层次与性质图</title><desc id="desc">上部区分均方、逐点和Gibbs，下部展示时间操作到傅里叶系数操作的映射。</desc><defs><marker id="a32" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#274b68"/></marker><style>.bg{fill:#fbfdff}.b{fill:#eef5ff;stroke:#275dad;stroke-width:3}.w{fill:#fff4df;stroke:#b26700;stroke-width:3}.g{fill:#edf9f1;stroke:#27864b;stroke-width:3}.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:23px}.m{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:26px}.h{font-size:34px;font-weight:700}.s{font-size:19px;fill:#48677d}.l{stroke:#274b68;stroke-width:3;fill:none;marker-end:url(#a32)}</style></defs><rect width="1240" height="760" class="bg"/><text x="45" y="55" class="t h">CTFS：先明确收敛意义，再调用性质映射</text><rect x="55" y="105" width="330" height="145" rx="16" class="b"/><text x="80" y="155" class="t">有限部分和 x_N</text><text x="80" y="198" class="m">E_N=∫|x−x_N|²dt</text><path d="M385 175H475" class="l"/><rect x="475" y="105" width="300" height="145" rx="16" class="g"/><text x="515" y="155" class="t">均方收敛</text><text x="500" y="198" class="m">E_N → 0</text><path d="M775 175H865" class="l"/><rect x="865" y="105" width="320" height="145" rx="16" class="w"/><text x="900" y="150" class="t">逐点边界</text><text x="895" y="190" class="t s">连续点→x；跳变点→左右中值</text><text x="895" y="220" class="t s">附近存在 Gibbs 振铃</text><text x="55" y="315" class="t">常用充分条件：绝对可积 + 有限起伏 + 有限跳变（不是必要条件）</text><line x1="50" y1="350" x2="1190" y2="350" stroke="#cbd8e6" stroke-width="2"/><text x="55" y="405" class="t h">时间操作 ↔ 系数操作</text><rect x="55" y="455" width="245" height="100" rx="14" class="b"/><text x="75" y="495" class="t">时移 t₀</text><text x="75" y="530" class="m">e⁻ʲᵏω⁰ᵗ⁰aₖ</text><rect x="330" y="455" width="245" height="100" rx="14" class="b"/><text x="350" y="495" class="t">时间反转</text><text x="350" y="530" class="m">a₋ₖ</text><rect x="605" y="455" width="245" height="100" rx="14" class="b"/><text x="625" y="495" class="t">时域相乘</text><text x="625" y="530" class="m">Σa_l bₖ₋l</text><rect x="880" y="455" width="305" height="100" rx="14" class="b"/><text x="900" y="495" class="t">周期卷积</text><text x="900" y="530" class="m">T aₖbₖ</text><rect x="55" y="600" width="245" height="100" rx="14" class="g"/><text x="75" y="640" class="t">微分</text><text x="75" y="675" class="m">jkω₀aₖ</text><rect x="330" y="600" width="245" height="100" rx="14" class="g"/><text x="350" y="640" class="t">积分</text><text x="350" y="675" class="m">aₖ/(jkω₀)</text><rect x="605" y="600" width="245" height="100" rx="14" class="g"/><text x="625" y="640" class="t">复共轭</text><text x="625" y="675" class="m">a₋ₖ*</text><rect x="880" y="600" width="305" height="100" rx="14" class="w"/><text x="900" y="640" class="t">Parseval</text><text x="900" y="675" class="m">P=Σ|aₖ|²</text></svg>
