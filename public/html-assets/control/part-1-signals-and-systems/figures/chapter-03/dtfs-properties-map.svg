<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc"><title id="title">DTFS性质与最小功率图</title><desc id="desc">展示相乘、一次差分、帕斯瓦尔及受约束最小功率解之间的关系。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#294d68"/></marker><style>.bg{fill:#fbfdff}.b{fill:#eaf3ff;stroke:#2864ad;stroke-width:3}.g{fill:#ecf8f0;stroke:#2b824d;stroke-width:3}.o{fill:#fff3dc;stroke:#b56c00;stroke-width:3}.p{fill:#f3efff;stroke:#7552aa;stroke-width:3}.l{stroke:#294d68;stroke-width:3;fill:none;marker-end:url(#a)}.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:22px}.h{font-size:34px;font-weight:700}.m{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:25px}.s{font-size:18px;fill:#49687d}</style></defs><rect width="1280" height="790" class="bg"/><text x="45" y="55" class="t h">DTFS 性质：把时域操作转成有限谱坐标运算</text><rect x="55" y="105" width="350" height="145" rx="17" class="b"/><text x="90" y="150" class="t">时域相乘</text><text x="78" y="190" class="m">dₖ=Σₗaₗbₖ₋ₗ</text><text x="78" y="225" class="t s">N点循环卷积 · 谐波混频</text><rect x="465" y="105" width="350" height="145" rx="17" class="g"/><text x="500" y="150" class="t">一次差分</text><text x="490" y="190" class="m">(1−e⁻ʲᵏ²π/ᴺ)aₖ</text><text x="490" y="225" class="t s">去直流 · 高频增强</text><rect x="875" y="105" width="350" height="145" rx="17" class="o"/><text x="910" y="150" class="t">帕斯瓦尔</text><text x="900" y="190" class="m">P=Σₖ|aₖ|²</text><text x="900" y="225" class="t s">时域RMS ↔ 谐波功率</text><path d="M230 250V335H500" class="l"/><path d="M640 250V335H640" class="l"/><path d="M1050 250V335H780" class="l"/><rect x="330" y="335" width="620" height="130" rx="18" class="p"/><text x="400" y="385" class="t">性质法：分解为已知模板 + 只处理变化部分</text><text x="405" y="425" class="t s">例3.13：三点方波 + 直流 → 复用系数并线性叠加</text><path d="M640 465V535" class="l"/><rect x="230" y="535" width="820" height="165" rx="18" class="g"/><text x="290" y="585" class="t">线性约束指定傅里叶坐标</text><text x="290" y="625" class="m">a₀=1/3，a₃=1/6</text><text x="660" y="585" class="t">最小功率 = 其余坐标置零</text><text x="660" y="625" class="m">x[n]=1/3+(1/6)(−1)ⁿ</text><text x="405" y="675" class="t s">正交投影 · 最小范数 · 最小RMS/控制能量原型</text><text x="350" y="755" class="t s">核心方法：先识别操作和约束对应哪个谱坐标，再用正交性避免时域蛮算</text></svg>
