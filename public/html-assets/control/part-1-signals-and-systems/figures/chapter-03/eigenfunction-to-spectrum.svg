<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">复指数特征函数到线频谱</title><desc id="desc">周期输入由谐波复指数合成，LTI 系统对每个谐波乘以频率响应，输出频谱保持相同频率网格。</desc><defs><marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#254b68"/></marker><style>.bg{fill:#fbfdff}.box{fill:#eef5ff;stroke:#275dad;stroke-width:3}.sys{fill:#fff1dc;stroke:#b26700;stroke-width:4}.line{stroke:#254b68;stroke-width:3;fill:none;marker-end:url(#arr3)}.stem{stroke:#275dad;stroke-width:5}.stem2{stroke:#27864b;stroke-width:5}.txt{font-family:'Microsoft YaHei',sans-serif;fill:#17324a;font-size:24px}.math{font-family:Cambria Math,'Times New Roman',serif;fill:#102a43;font-size:28px}.title{font-size:34px;font-weight:700}.small{font-size:20px;fill:#48677d}</style></defs><rect width="1240" height="760" class="bg"/><text x="50" y="58" class="txt title">复指数特征函数：LTI 在谐波坐标中逐项缩放</text><rect x="55" y="120" width="350" height="135" rx="16" class="box"/><text x="85" y="172" class="math">x(t)=Σ aₖeʲᵏω⁰ᵗ</text><text x="85" y="215" class="txt small">输入：同一基波网格上的谐波和</text><path d="M405 188H525" class="line"/><rect x="525" y="125" width="200" height="125" rx="20" class="sys"/><text x="580" y="180" class="math">H(jω)</text><text x="555" y="218" class="txt small">LTI 系统</text><path d="M725 188H845" class="line"/><rect x="845" y="120" width="340" height="135" rx="16" class="box"/><text x="870" y="172" class="math">y(t)=Σ aₖH(jkω₀)eʲᵏω⁰ᵗ</text><text x="875" y="215" class="txt small">输出：频率不变，复幅值被缩放</text><text x="55" y="330" class="txt">输入线频谱 aₖ</text><line x1="80" y1="570" x2="535" y2="570" stroke="#71879a" stroke-width="2"/><line x1="305" y1="380" x2="305" y2="600" stroke="#71879a" stroke-width="2"/><line x1="125" y1="570" x2="125" y2="500" class="stem"/><line x1="215" y1="570" x2="215" y2="445" class="stem"/><line x1="305" y1="570" x2="305" y2="410" class="stem"/><line x1="395" y1="570" x2="395" y2="445" class="stem"/><line x1="485" y1="570" x2="485" y2="500" class="stem"/><text x="112" y="625" class="txt small">−2</text><text x="205" y="625" class="txt small">−1</text><text x="298" y="625" class="txt small">0</text><text x="390" y="625" class="txt small">1</text><text x="480" y="625" class="txt small">2</text><text x="760" y="330" class="txt">输出线频谱 aₖH(jkω₀)</text><line x1="700" y1="570" x2="1160" y2="570" stroke="#71879a" stroke-width="2"/><line x1="930" y1="380" x2="930" y2="600" stroke="#71879a" stroke-width="2"/><line x1="750" y1="570" x2="750" y2="535" class="stem2"/><line x1="840" y1="570" x2="840" y2="475" class="stem2"/><line x1="930" y1="570" x2="930" y2="425" class="stem2"/><line x1="1020" y1="570" x2="1020" y2="510" class="stem2"/><line x1="1110" y1="570" x2="1110" y2="550" class="stem2"/><text x="737" y="625" class="txt small">−2</text><text x="830" y="625" class="txt small">−1</text><text x="923" y="625" class="txt small">0</text><text x="1015" y="625" class="txt small">1</text><text x="1105" y="625" class="txt small">2</text><text x="250" y="690" class="txt small">谱线位置由周期决定</text><text x="835" y="690" class="txt small">系统只改变每条谱线的幅值和相位</text></svg>

