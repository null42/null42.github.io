<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470"><rect width="940" height="470" rx="24" fill="#f8fafc"/><text x="470" y="55" text-anchor="middle" font-size="30" font-family="Microsoft YaHei">系统性质：每一项都必须用定义检验</text><g font-family="Microsoft YaHei" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb"><rect x="70" y="100" width="230" height="75" rx="15"/><rect x="355" y="100" width="230" height="75" rx="15"/><rect x="640" y="100" width="230" height="75" rx="15"/></g><text x="185" y="145" font-size="23">记忆性</text><text x="470" y="145" font-size="23">可逆性</text><text x="755" y="145" font-size="23">因果性</text><g fill="#dcfce7" stroke="#16a34a"><rect x="70" y="235" width="230" height="75" rx="15"/><rect x="355" y="235" width="230" height="75" rx="15"/><rect x="640" y="235" width="230" height="75" rx="15"/></g><text x="185" y="280" font-size="23">稳定性</text><text x="470" y="280" font-size="23">时不变性</text><text x="755" y="280" font-size="23">线性</text><rect x="255" y="370" width="430" height="65" rx="15" fill="#fff" stroke="#64748b"/><text x="470" y="410" font-size="22">反例必须满足“存在一个输入即可否定”</text></g></svg>
