<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">离散单位冲激与单位阶跃关系</title><desc id="d">单位冲激是阶跃的一阶差分，阶跃是冲激的累加。</desc><rect width="900" height="420" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><rect x="70" y="55" width="300" height="95" rx="18" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="105" font-size="28">δ[n]=u[n]−u[n−1]</text><rect x="530" y="55" width="300" height="95" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="680" y="105" font-size="27">u[n]=Σ δ[k]</text><path d="M370 103 H530" stroke="#334155" stroke-width="3"/><text x="450" y="88" font-size="20">差分 ↔ 累加</text></g><line x1="90" y1="305" x2="390" y2="305" stroke="#334155" stroke-width="2"/><line x1="230" y1="350" x2="230" y2="215" stroke="#334155" stroke-width="2"/><line x1="230" y1="305" x2="230" y2="235" stroke="#2563eb" stroke-width="5"/><circle cx="230" cy="235" r="7" fill="#2563eb"/><text x="205" y="210" font-size="22">δ[n]</text><line x1="510" y1="305" x2="830" y2="305" stroke="#334155" stroke-width="2"/><line x1="650" y1="350" x2="650" y2="215" stroke="#334155" stroke-width="2"/><path d="M520 305 H650 V240 H820" fill="none" stroke="#16a34a" stroke-width="5"/><text x="740" y="220" font-size="22">u[n]</text></svg>
