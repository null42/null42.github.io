<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">离散时间频率按二π等价</title>
  <desc id="desc">频率轴上相差二π整数倍的频率映射到完全相同的离散复指数序列。</desc>
  <rect width="920" height="440" rx="24" fill="#f8fafc"/>
  <line x1="70" y1="125" x2="850" y2="125" stroke="#334155" stroke-width="3"/>
  <g fill="#334155" font-size="20" text-anchor="middle">
    <text x="120" y="165">ω₀−2π</text><text x="460" y="165">ω₀</text><text x="800" y="165">ω₀+2π</text>
  </g>
  <g stroke="#2563eb" stroke-width="4"><line x1="120" y1="95" x2="120" y2="145"/><line x1="460" y1="85" x2="460" y2="145"/><line x1="800" y1="95" x2="800" y2="145"/></g>
  <path d="M120 205 C235 285 345 285 460 205" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <path d="M460 205 C575 285 685 285 800 205" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="460" y="310" text-anchor="middle" font-size="27" fill="#0f172a">e^{j(ω₀+2πr)n}=e^{jω₀n},　r∈ℤ</text>
  <rect x="180" y="340" width="560" height="62" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="460" y="380" text-anchor="middle" font-size="22" fill="#3730a3">常用主值区间：−π≤ω&lt;π；区间选择不改变序列</text>
</svg>
