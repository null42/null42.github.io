<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">连续与离散谐波复指数族比较</title>
  <desc id="desc">连续时间谐波族有无限多个不同成员，离散时间长度N的谐波族只有N个不同成员。</desc>
  <rect width="920" height="500" rx="24" fill="#f8fafc"/>
  <rect x="55" y="55" width="370" height="380" rx="22" fill="#eff6ff" stroke="#60a5fa"/>
  <rect x="495" y="55" width="370" height="380" rx="22" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="240" y="100" text-anchor="middle" font-size="27" fill="#1e3a8a">连续时间</text>
  <text x="680" y="100" text-anchor="middle" font-size="27" fill="#4c1d95">离散时间</text>
  <text x="240" y="150" text-anchor="middle" font-size="23" fill="#0f172a">φₖ(t)=e^{jk(2π/T)t}</text>
  <text x="680" y="150" text-anchor="middle" font-size="23" fill="#0f172a">φₖ[n]=e^{jk(2π/N)n}</text>
  <g fill="#2563eb"><circle cx="115" cy="230" r="12"/><circle cx="180" cy="230" r="12"/><circle cx="245" cy="230" r="12"/><circle cx="310" cy="230" r="12"/><circle cx="375" cy="230" r="12"/></g>
  <text x="240" y="275" text-anchor="middle" font-size="21" fill="#1e3a8a">… k=−2,−1,0,1,2 …</text>
  <text x="240" y="325" text-anchor="middle" font-size="23" fill="#0f172a">每个整数 k 都给出新频率</text>
  <text x="240" y="370" text-anchor="middle" font-size="25" fill="#b91c1c">无限多个不同信号</text>
  <g fill="#7c3aed"><circle cx="555" cy="230" r="12"/><circle cx="615" cy="230" r="12"/><circle cx="675" cy="230" r="12"/><circle cx="735" cy="230" r="12"/><circle cx="795" cy="230" r="12"/></g>
  <path d="M795 230 C830 195 830 165 795 145" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="680" y="280" text-anchor="middle" font-size="21" fill="#4c1d95">k 与 k+N 完全相同</text>
  <text x="680" y="325" text-anchor="middle" font-size="23" fill="#0f172a">频率索引按 N 取模</text>
  <text x="680" y="370" text-anchor="middle" font-size="25" fill="#b91c1c">恰好 N 个不同信号</text>
</svg>
