<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">冲激抽样与尺度变换</title><desc id="d">冲激只保留信号在冲激位置的值，并展示时间缩放导致面积保持时冲激高度变化。</desc><rect width="920" height="470" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei,sans-serif"><text x="460" y="60" text-anchor="middle" font-size="30" fill="#0f172a">x(t)δ(t−t₀)=x(t₀)δ(t−t₀)</text><path d="M80 260 C170 195 250 120 360 190 C420 230 460 300 520 225 C590 135 690 155 840 235" fill="none" stroke="#2563eb" stroke-width="4"/><line x1="80" y1="300" x2="840" y2="300" stroke="#334155" stroke-width="2"/><line x1="520" y1="300" x2="520" y2="225" stroke="#ef4444" stroke-width="5"/><circle cx="520" cy="225" r="7" fill="#ef4444"/><text x="520" y="330" text-anchor="middle" font-size="22">t₀</text><text x="550" y="215" font-size="22" fill="#b91c1c">x(t₀)</text><rect x="145" y="355" width="630" height="75" rx="16" fill="#fff" stroke="#94a3b8"/><text x="460" y="400" text-anchor="middle" font-size="26">δ(at)=1/|a| · δ(t)　（面积保持）</text></g></svg>
