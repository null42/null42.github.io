<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="590" y="46" text-anchor="middle" font-size="28" font-weight="700">同步解调与包络检测</text><rect x="55" y="95" width="1070" height="235" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="80" y="130" font-size="20" font-weight="700" fill="#1e3a8a">同步路径：保留符号与相位</text><rect x="90" y="175" width="210" height="90" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="195" y="210" text-anchor="middle" font-size="17" font-weight="700">y(t)</text><text x="195" y="238" text-anchor="middle" font-size="14">DSB已调信号</text><rect x="380" y="175" width="210" height="90" rx="12" fill="#fff" stroke="#2563eb"/><text x="485" y="208" text-anchor="middle" font-size="17" font-weight="700">× cos(Ωdt+φc)</text><text x="485" y="238" text-anchor="middle" font-size="14">相干混频</text><rect x="670" y="175" width="180" height="90" rx="12" fill="#fff" stroke="#2563eb"/><text x="760" y="208" text-anchor="middle" font-size="17" font-weight="700">低通 ×2</text><text x="760" y="238" text-anchor="middle" font-size="14">删除和频项</text><rect x="930" y="175" width="150" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="1005" y="207" text-anchor="middle" font-size="17" font-weight="700">x_r(t)</text><text x="1005" y="237" text-anchor="middle" font-size="13">cosΔφ或拍频</text><path d="M300 220H370M590 220H660M850 220H920" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="590" y="305" text-anchor="middle" font-size="14" fill="#b91c1c">相位失配：x cosΔφ　频率失配：x cos(ΔΩt)　I/Q可观测旋转</text><rect x="55" y="370" width="1070" height="240" rx="18" fill="#fff7ed" stroke="#fdba74"/><text x="80" y="405" font-size="20" font-weight="700" fill="#9a3412">非同步路径：用载波功率换简单接收机</text><rect x="90" y="452" width="230" height="92" rx="12" fill="#ffedd5" stroke="#f97316"/><text x="205" y="485" text-anchor="middle" font-size="17" font-weight="700">[A+x(t)]cosΩct</text><text x="205" y="515" text-anchor="middle" font-size="14">A&gt;K，m=K/A</text><rect x="415" y="452" width="220" height="92" rx="12" fill="#fff" stroke="#f97316"/><text x="525" y="485" text-anchor="middle" font-size="17" font-weight="700">二极管 + RC</text><text x="525" y="515" text-anchor="middle" font-size="14">1/Ωc ≪ RC ≪ 1/ΩM</text><rect x="730" y="452" width="300" height="92" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="880" y="485" text-anchor="middle" font-size="17" font-weight="700">包络 A+x(t)</text><text x="880" y="515" text-anchor="middle" font-size="14">m&gt;1时过调制失真</text><path d="M320 498H405M635 498H720" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="590" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">控制迁移：I/Q锁相检测用于有符号误差；包络检测用于低成本幅值监测</text></svg>
