<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="550" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">调制 = 频谱搬移</text><rect x="70" y="105" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="140" text-anchor="middle" font-size="18" font-weight="700">基带 X(jΩ)</text><text x="180" y="168" text-anchor="middle" font-size="14">|Ω|≤ΩM</text><rect x="390" y="105" width="260" height="90" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="520" y="138" text-anchor="middle" font-size="18" font-weight="700">× e^{jΩct}</text><text x="520" y="168" text-anchor="middle" font-size="14">单向复指数载波</text><rect x="750" y="105" width="280" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="890" y="138" text-anchor="middle" font-size="18" font-weight="700">X(j(Ω−Ωc))</text><text x="890" y="168" text-anchor="middle" font-size="14">整体向 +Ωc 平移</text><path d="M290 150H380M650 150H740" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="70" y="265" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="300" text-anchor="middle" font-size="18" font-weight="700">基带 x(t)</text><text x="180" y="328" text-anchor="middle" font-size="14">实信号</text><rect x="390" y="265" width="260" height="90" rx="14" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="520" y="298" text-anchor="middle" font-size="18" font-weight="700">× cos(Ωct)</text><text x="520" y="328" text-anchor="middle" font-size="14">正负两个复指数</text><rect x="750" y="265" width="280" height="90" rx="14" fill="#ffedd5" stroke="#f97316"/><text x="890" y="296" text-anchor="middle" font-size="17" font-weight="700">½X(Ω−Ωc)+½X(Ω+Ωc)</text><text x="890" y="328" text-anchor="middle" font-size="14">双边带，需避免重叠</text><path d="M290 310H380M650 310H740" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="430" width="740" height="105" rx="16" fill="#ede9fe" stroke="#8b5cf6"/><text x="550" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#5b21b6">解调：乘反向载波，把目标边带搬回基带</text><text x="550" y="495" text-anchor="middle" font-size="15">复I/Q保留方向与相位；实同步解调需低通删除2Ωc分量</text><text x="550" y="522" text-anchor="middle" font-size="15">控制迁移：dq变换 · 锁相检测 · 无感高频注入</text></svg>
