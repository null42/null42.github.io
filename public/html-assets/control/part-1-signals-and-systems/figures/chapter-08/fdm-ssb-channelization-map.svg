<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs><rect width="1180" height="700" rx="24" fill="#f8fafc"/><text x="590" y="45" text-anchor="middle" font-size="28" font-weight="700">FDM通道化与单边带生成</text><rect x="55" y="90" width="1070" height="235" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="80" y="125" font-size="20" font-weight="700" fill="#1e3a8a">频分多路复用</text><rect x="90" y="165" width="210" height="95" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="195" y="198" text-anchor="middle" font-size="17" font-weight="700">x_i(t)</text><text x="195" y="227" text-anchor="middle" font-size="14">各路带限基带</text><rect x="375" y="165" width="230" height="95" rx="12" fill="#fff" stroke="#2563eb"/><text x="490" y="198" text-anchor="middle" font-size="17" font-weight="700">× cos(Ω_i t)</text><text x="490" y="227" text-anchor="middle" font-size="14">搬到不同子信道</text><rect x="680" y="165" width="180" height="95" rx="12" fill="#fff" stroke="#2563eb"/><text x="770" y="198" text-anchor="middle" font-size="17" font-weight="700">Σ</text><text x="770" y="227" text-anchor="middle" font-size="14">共享宽带信道</text><rect x="935" y="165" width="150" height="95" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="1010" y="198" text-anchor="middle" font-size="17" font-weight="700">BPF→混频→LPF</text><text x="1010" y="227" text-anchor="middle" font-size="13">逐路解复用</text><path d="M300 212H365M605 212H670M860 212H925" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="590" y="300" text-anchor="middle" font-size="14" fill="#b91c1c">相邻子信道 = 占用带宽 + 保护带；同时检查邻道泄漏、互调和别名</text><rect x="55" y="365" width="1070" height="255" rx="18" fill="#fff7ed" stroke="#fdba74"/><text x="80" y="400" font-size="20" font-weight="700" fill="#9a3412">单边带：B_DSB=2ΩM → B_SSB=ΩM</text><rect x="90" y="445" width="280" height="105" rx="12" fill="#ffedd5" stroke="#f97316"/><text x="230" y="478" text-anchor="middle" font-size="17" font-weight="700">滤波法</text><text x="230" y="507" text-anchor="middle" font-size="14">DSB → 锐截止边带滤波器</text><text x="230" y="532" text-anchor="middle" font-size="13">难点：载波附近过渡带</text><rect x="450" y="445" width="300" height="105" rx="12" fill="#fff" stroke="#f97316"/><text x="600" y="478" text-anchor="middle" font-size="17" font-weight="700">90°移相法</text><text x="600" y="507" text-anchor="middle" font-size="14">x 与 Hilbert{x} 正交调制</text><text x="600" y="532" text-anchor="middle" font-size="13">一边带相加，另一边带相消</text><rect x="830" y="445" width="255" height="105" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="957" y="478" text-anchor="middle" font-size="17" font-weight="700">解析信号</text><text x="957" y="507" text-anchor="middle" font-size="14">z_a=x+jx_h</text><text x="957" y="532" text-anchor="middle" font-size="13">旋转符号选择USB/LSB</text><path d="M370 497H440M750 497H820" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="590" y="660" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">控制迁移：多频注入通道化 · 正负序分离 · 单边带镜像抑制</text></svg>
