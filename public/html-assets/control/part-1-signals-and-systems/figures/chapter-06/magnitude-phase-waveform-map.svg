<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">模、相位与波形关系图</title><desc id="desc">频谱模决定频率含量，相位决定向量叠加，进而影响波形、峰值、延迟和控制指标。</desc><defs><style>.b{fill:#f7faff;stroke:#275dad;stroke-width:2;rx:15}.o{fill:#fff5e8;stroke:#d87500;stroke-width:2;rx:15}.g{fill:#eef9f1;stroke:#23824b;stroke-width:2;rx:15}.t{font:700 22px 'Microsoft YaHei',sans-serif;fill:#17335c}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#26384f}.a{stroke:#60738e;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#60738e"/></marker></defs><rect width="1120" height="620" fill="#fff"/>
<rect class="b" x="55" y="75" width="260" height="135"/><text class="t" x="185" y="118" text-anchor="middle">频谱模 |X|</text><text class="s" x="185" y="157" text-anchor="middle">频率位置与相对振幅</text><text class="s" x="185" y="185" text-anchor="middle">能量 / RMS 分配</text>
<rect class="b" x="55" y="330" width="260" height="150"/><text class="t" x="185" y="374" text-anchor="middle">频谱相位 ∠X</text><text class="s" x="185" y="412" text-anchor="middle">相对时间位置</text><text class="s" x="185" y="441" text-anchor="middle">线性部分：整体时移</text><text class="s" x="185" y="468" text-anchor="middle">非线性部分：形状改变</text>
<rect class="o" x="430" y="190" width="270" height="175"/><text class="t" x="565" y="235" text-anchor="middle">反变换向量叠加</text><text class="s" x="565" y="274" text-anchor="middle">|X| 决定向量长度</text><text class="s" x="565" y="305" text-anchor="middle">ωt+φ 决定向量方向</text><text class="s" x="565" y="337" text-anchor="middle">相干相加或相互抵消</text>
<rect class="g" x="815" y="90" width="250" height="170"/><text class="t" x="940" y="134" text-anchor="middle">时域波形</text><text class="s" x="940" y="171" text-anchor="middle">峰值 · 过零 · 对称</text><text class="s" x="940" y="201" text-anchor="middle">延迟 · 瞬态 · 振铃</text><text class="s" x="940" y="230" text-anchor="middle">同幅谱仍可完全不同</text>
<rect class="g" x="815" y="360" width="250" height="170"/><text class="t" x="940" y="404" text-anchor="middle">控制与实现</text><text class="s" x="940" y="441" text-anchor="middle">相位裕度与群延迟</text><text class="s" x="940" y="471" text-anchor="middle">峰值应力与饱和</text><text class="s" x="940" y="500" text-anchor="middle">复FRF辨识与谐波调相</text>
<path class="a" d="M315 145 C365 145 380 225 430 250"/><path class="a" d="M315 405 C365 405 380 335 430 315"/><path class="a" d="M700 260 C750 230 770 180 815 175"/><path class="a" d="M700 315 C755 350 770 430 815 445"/><path class="a" d="M940 260 L940 360"/>
</svg>
