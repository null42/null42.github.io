<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc"><title id="title">LTI相位与群时延知识链</title><desc id="desc">从Y=HX分解系统增益与相移，区分线性和非线性相位，通过相位展开得到群时延并映射到控制时序。</desc><defs><style>.b{fill:#f7faff;stroke:#275dad;stroke-width:2;rx:15}.o{fill:#fff5e8;stroke:#d87500;stroke-width:2;rx:15}.g{fill:#eef9f1;stroke:#23824b;stroke-width:2;rx:15}.t{font:700 21px 'Microsoft YaHei',sans-serif;fill:#17335c}.s{font:15px 'Microsoft YaHei',sans-serif;fill:#26384f}.a{stroke:#60738e;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#60738e"/></marker></defs><rect width="1180" height="650" fill="#fff"/>
<rect class="b" x="40" y="75" width="250" height="145"/><text class="t" x="165" y="116" text-anchor="middle">Y = H X</text><text class="s" x="165" y="154" text-anchor="middle">|Y|=|H||X|</text><text class="s" x="165" y="184" text-anchor="middle">∠Y=∠H+∠X</text>
<rect class="b" x="355" y="40" width="265" height="160"/><text class="t" x="488" y="82" text-anchor="middle">线性相位</text><text class="s" x="488" y="120" text-anchor="middle">φ(ω)=−ωt₀</text><text class="s" x="488" y="150" text-anchor="middle">常数群时延</text><text class="s" x="488" y="179" text-anchor="middle">波形整体平移</text>
<rect class="o" x="355" y="280" width="265" height="175"/><text class="t" x="488" y="323" text-anchor="middle">非线性相位 / 全通</text><text class="s" x="488" y="361" text-anchor="middle">|H|=1 仍可失真</text><text class="s" x="488" y="391" text-anchor="middle">不同频率延迟不同</text><text class="s" x="488" y="422" text-anchor="middle">冲激响应展宽与振铃</text>
<rect class="o" x="700" y="85" width="250" height="155"/><text class="t" x="825" y="127" text-anchor="middle">相位展开</text><text class="s" x="825" y="165" text-anchor="middle">移除人为2π跳变</text><text class="s" x="825" y="196" text-anchor="middle">保留真实连续斜率</text>
<rect class="b" x="700" y="330" width="250" height="155"/><text class="t" x="825" y="372" text-anchor="middle">群时延</text><text class="s" x="825" y="410" text-anchor="middle">τ(ω)=−dφ/dω</text><text class="s" x="825" y="441" text-anchor="middle">窄带包络到达时间</text>
<rect class="g" x="990" y="225" width="160" height="205"/><text class="t" x="1070" y="270" text-anchor="middle">控制影响</text><text class="s" x="1070" y="310" text-anchor="middle">相位裕度</text><text class="s" x="1070" y="340" text-anchor="middle">反馈同步</text><text class="s" x="1070" y="370" text-anchor="middle">估计延迟</text><text class="s" x="1070" y="400" text-anchor="middle">振铃风险</text>
<path class="a" d="M290 140 L355 120"/><path class="a" d="M290 165 C325 240 330 350 355 365"/><path class="a" d="M620 365 C660 330 670 210 700 170"/><path class="a" d="M825 240 L825 330"/><path class="a" d="M950 405 C970 405 980 360 990 340"/><path class="a" d="M620 120 C760 40 920 70 1020 225"/>
</svg>
