<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">标幺值把不同量纲映射到同一尺度</title>
  <desc id="desc">电压、电流、速度、转矩先除以各自基值，进入控制算法时都落在接近负一到正一的统一范围。</desc>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:10}
    .arrow{stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
    .axis{stroke:#475569;stroke-width:2}
    .bar{fill:#0f766e}
    .bar2{fill:#dc2626}
    .label{font-size:22px;font-weight:700}
    .small{font-size:18px}
    .formula{font-size:24px;font-weight:700}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="40" y="50" width="250" height="300" class="panel"/>
  <text x="70" y="95" class="label">实际物理量</text>
  <text x="70" y="145" class="small">电压 48 V / 400 V</text>
  <text x="70" y="190" class="small">电流 5 A / 80 A</text>
  <text x="70" y="235" class="small">速度 3000 rpm</text>
  <text x="70" y="280" class="small">转矩 0.8 N·m</text>
  <line x1="310" y1="200" x2="450" y2="200" class="arrow"/>
  <text x="328" y="168" class="formula">x<tspan baseline-shift="sub" font-size="16">pu</tspan> = x / x<tspan baseline-shift="sub" font-size="16">base</tspan></text>
  <rect x="470" y="50" width="440" height="300" class="panel"/>
  <text x="500" y="95" class="label">算法看到的统一尺度</text>
  <line x1="540" y1="250" x2="850" y2="250" class="axis"/>
  <line x1="695" y1="130" x2="695" y2="300" class="axis"/>
  <text x="528" y="282" class="small">-1</text>
  <text x="690" y="282" class="small">0</text>
  <text x="838" y="282" class="small">+1</text>
  <rect x="695" y="145" width="110" height="24" class="bar"/>
  <rect x="610" y="190" width="85" height="24" class="bar2"/>
  <rect x="695" y="235" width="55" height="24" class="bar"/>
  <text x="815" y="165" class="small">v = 0.72 pu</text>
  <text x="500" y="210" class="small">i = -0.55 pu</text>
  <text x="760" y="255" class="small">ω = 0.36 pu</text>
  <text x="500" y="330" class="small">同一套限幅、PI、弱磁、SVPWM 可以跨电机复用</text>
</svg>
