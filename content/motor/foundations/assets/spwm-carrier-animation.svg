<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">SPWM 正弦参考与三角载波比较</title>
  <desc id="desc">蓝色正弦参考与橙色三角载波比较，参考高于载波时输出高电平，形成宽度随正弦变化的 PWM 脉冲。</desc>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .axis{stroke:#475569;stroke-width:2}
    .carrier{fill:none;stroke:#b45309;stroke-width:3}
    .sine{fill:none;stroke:#2563eb;stroke-width:4}
    .pulse{fill:#0f766e}
    .cursor{stroke:#ef4444;stroke-width:3}
    .label{font-size:20px;font-weight:700}
    .small{font-size:16px}
  </style>
  <line x1="60" y1="180" x2="900" y2="180" class="axis"/>
  <line x1="60" y1="45" x2="60" y2="320" class="axis"/>
  <path class="sine" d="M60 180 C140 60 220 60 300 180 S460 300 540 180 S700 60 780 180 S880 300 900 235"/>
  <path class="carrier" d="M60 300 L100 60 L140 300 L180 60 L220 300 L260 60 L300 300 L340 60 L380 300 L420 60 L460 300 L500 60 L540 300 L580 60 L620 300 L660 60 L700 300 L740 60 L780 300 L820 60 L860 300 L900 180"/>
  <g opacity="0.85">
    <rect x="70" y="340" width="30" height="28" class="pulse"/>
    <rect x="145" y="340" width="58" height="28" class="pulse"/>
    <rect x="225" y="340" width="72" height="28" class="pulse"/>
    <rect x="305" y="340" width="42" height="28" class="pulse"/>
    <rect x="385" y="340" width="18" height="28" class="pulse"/>
    <rect x="465" y="340" width="24" height="28" class="pulse"/>
    <rect x="545" y="340" width="52" height="28" class="pulse"/>
    <rect x="625" y="340" width="74" height="28" class="pulse"/>
    <rect x="705" y="340" width="55" height="28" class="pulse"/>
    <rect x="785" y="340" width="32" height="28" class="pulse"/>
  </g>
  <line x1="100" y1="42" x2="100" y2="370" class="cursor">
    <animate attributeName="x1" values="100;860;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100;860;100" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="80" y="32" class="label">蓝色：三相正弦参考中的 A 相</text>
  <text x="390" y="32" class="label">橙色：三角载波</text>
  <text x="610" y="392" class="label">下方：比较器输出 PWM</text>
  <text x="80" y="392" class="small">参考越高，脉冲越宽；参考越低，脉冲越窄。</text>
</svg>
