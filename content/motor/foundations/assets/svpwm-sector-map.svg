<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img" aria-labelledby="title desc">
  <title id="title">SVPWM 六扇区空间矢量图</title>
  <desc id="desc">六个有效矢量围成六边形，参考矢量旋转时落入不同扇区，由相邻两个矢量和零矢量合成。</desc>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .hex{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
    .sectorFill{fill:#dbeafe;opacity:.75}
    .axis{stroke:#475569;stroke-width:2}
    .vec{stroke:#0f766e;stroke-width:4;marker-end:url(#arrow)}
    .ref{stroke:#ef4444;stroke-width:5;marker-end:url(#arrowRed)}
    .label{font-size:18px}
    .sector{font-size:22px;font-weight:700}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker>
  </defs>
  <polygon points="620,350 515,532 305,532 200,350 305,168 515,168" class="hex"/>
  <polygon points="410,350 620,350 515,168" class="sectorFill"/>
  <line x1="130" y1="350" x2="690" y2="350" class="axis"/>
  <line x1="410" y1="95" x2="410" y2="605" class="axis"/>
  <line x1="410" y1="350" x2="620" y2="350" class="vec"/>
  <line x1="410" y1="350" x2="515" y2="168" class="vec"/>
  <line x1="410" y1="350" x2="305" y2="168" class="vec"/>
  <line x1="410" y1="350" x2="200" y2="350" class="vec"/>
  <line x1="410" y1="350" x2="305" y2="532" class="vec"/>
  <line x1="410" y1="350" x2="515" y2="532" class="vec"/>
  <line x1="410" y1="350" x2="555" y2="255" class="ref">
    <animateTransform attributeName="transform" type="rotate" from="0 410 350" to="360 410 350" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="642" y="356" class="label">V1 100</text>
  <text x="525" y="156" class="label">V2 110</text>
  <text x="245" y="156" class="label">V3 010</text>
  <text x="105" y="356" class="label">V4 011</text>
  <text x="245" y="575" class="label">V5 001</text>
  <text x="525" y="575" class="label">V6 101</text>
  <text x="515" y="310" class="sector">扇区 I</text>
  <text x="450" y="238" class="label">Vref 旋转</text>
  <text x="80" y="650" class="label">每个 PWM 周期：Vref = T1/Ts · Vx + T2/Ts · Vy + T0/Ts · V0</text>
</svg>
