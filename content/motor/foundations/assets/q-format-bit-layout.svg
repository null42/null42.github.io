<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Q15 定点数位布局</title>
  <desc id="desc">一个有符号 16 位整数被解释成 1 个符号位和 15 个小数位，整数 16384 表示 0.5。</desc>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .bit{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
    .sign{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
    .frac{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
    .arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}
    .label{font-size:22px;font-weight:700}
    .small{font-size:18px}
    .num{font-size:16px}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <text x="40" y="48" class="label">Q15：整数存储，小数解释</text>
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="50" height="70" class="sign"/>
    <text x="15" y="42" class="num">S</text>
    <text x="8" y="96" class="small">符号</text>
    <g transform="translate(60,0)">
      <rect x="0" y="0" width="50" height="70" class="frac"/><text x="13" y="42" class="num">2⁻¹</text>
      <rect x="50" y="0" width="50" height="70" class="frac"/><text x="63" y="42" class="num">2⁻²</text>
      <rect x="100" y="0" width="50" height="70" class="frac"/><text x="111" y="42" class="num">2⁻³</text>
      <rect x="150" y="0" width="50" height="70" class="frac"/><text x="168" y="42" class="num">...</text>
      <rect x="200" y="0" width="50" height="70" class="frac"/><text x="207" y="42" class="num">2⁻¹⁵</text>
      <text x="35" y="96" class="small">15 个小数位</text>
    </g>
  </g>
  <line x1="400" y1="130" x2="540" y2="130" class="arrow"/>
  <text x="420" y="105" class="small">约定缩放</text>
  <rect x="570" y="80" width="320" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="125" class="small">real = q15 / 32768</text>
  <text x="600" y="165" class="small">q15 = round(real × 32768)</text>
  <text x="600" y="205" class="small">16384 对应 0.5</text>
  <text x="70" y="295" class="small">乘法后临时结果是 Q30，回到 Q15 前必须右移 15 位并做饱和。</text>
</svg>
