<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">三电平 NPC 单相 P O N 状态</title>
  <desc id="desc">单相桥臂可以连接正母线、中点或负母线，对应 P、O、N 三种相电压状态。</desc>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .rail{stroke:#334155;stroke-width:4}
    .leg{stroke:#64748b;stroke-width:3}
    .on{fill:#dcfce7;stroke:#0f766e;stroke-width:3}
    .off{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
    .arrow{stroke:#ef4444;stroke-width:3;marker-end:url(#arrow)}
    .title{font-size:24px;font-weight:700}
    .label{font-size:18px}
    .state{font-size:30px;font-weight:700}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker>
  </defs>
  <text x="40" y="44" class="title">三电平单相桥臂：P / O / N</text>
  <line x1="70" y1="95" x2="880" y2="95" class="rail"/>
  <line x1="70" y1="220" x2="880" y2="220" class="rail"/>
  <line x1="70" y1="345" x2="880" y2="345" class="rail"/>
  <text x="22" y="102" class="label">+Vdc/2</text>
  <text x="50" y="226" class="label">O</text>
  <text x="25" y="352" class="label">-Vdc/2</text>
  <g transform="translate(140,0)">
    <line x1="80" y1="95" x2="80" y2="345" class="leg"/>
    <circle cx="80" cy="95" r="24" class="on"/><circle cx="80" cy="220" r="24" class="off"/><circle cx="80" cy="345" r="24" class="off"/>
    <line x1="80" y1="95" x2="155" y2="160" class="arrow"/>
    <text x="70" y="410" class="state">P</text>
    <text x="118" y="164" class="label">输出 +Vdc/2</text>
  </g>
  <g transform="translate(415,0)">
    <line x1="80" y1="95" x2="80" y2="345" class="leg"/>
    <circle cx="80" cy="95" r="24" class="off"/><circle cx="80" cy="220" r="24" class="on"/><circle cx="80" cy="345" r="24" class="off"/>
    <line x1="80" y1="220" x2="155" y2="220" class="arrow"/>
    <text x="68" y="410" class="state">O</text>
    <text x="118" y="214" class="label">输出 0</text>
  </g>
  <g transform="translate(690,0)">
    <line x1="80" y1="95" x2="80" y2="345" class="leg"/>
    <circle cx="80" cy="95" r="24" class="off"/><circle cx="80" cy="220" r="24" class="off"/><circle cx="80" cy="345" r="24" class="on"/>
    <line x1="80" y1="345" x2="155" y2="280" class="arrow"/>
    <text x="69" y="410" class="state">N</text>
    <text x="118" y="285" class="label">输出 -Vdc/2</text>
  </g>
  <circle cx="495" cy="220" r="10" fill="#2563eb">
    <animate attributeName="r" values="7;13;7" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="360" y="72" class="label">中点电压需要主动平衡</text>
</svg>
